<script>
/* ════════════════ HEAP / PRIORITY QUEUE ════════════════
   The heap lives in an array; we draw it as a complete binary tree.
   parent(i) = (i-1)/2   left(i) = 2i+1   right(i) = 2i+2
   Each frame carries a snapshot of the array + per-index highlight state. */
const CAP = 15;                                   // up to 4 levels (indices 0..14)
const HPOS = (function(){
  const W=560,H=300,padX=34,padY=30,maxLvl=3,pos=[];
  for(let i=0;i<CAP;i++){
    const lvl=Math.floor(Math.log2(i+1)), cnt=1<<lvl, pil=i-(cnt-1);
    pos.push([ padX+((pil+0.5)/cnt)*(W-2*padX), padY+(lvl/maxLvl)*(H-2*padY) ]);
  }
  return pos;
})();

/* ════════════════ SCENE ════════════════ */
function svgHeap(f){
  const A=f.heap||[], n=A.length;
  let s=`<svg viewBox="0 0 560 320" preserveAspectRatio="xMidYMid meet">`;
  for(let c=1;c<n;c++){ const par=(c-1)>>1; const [x1,y1]=HPOS[par],[x2,y2]=HPOS[c];
    const st=f.node&&f.node[c]; const on=(st==='swap'||st==='cmp'||st==='done'||st==='root');
    s+=`<line class="tedge${on?' on':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }
  for(let i=0;i<n;i++){ const [x,y]=HPOS[i]; const st=(f.node&&f.node[i])||'';
    let stroke='#3a4658',fill='#10161e',sw=2.2;
    if(st==='heap'){stroke='#00e5ff';fill='#06222b';}
    if(st==='done'){stroke='#69ff47';fill='#0c2417';}
    if(st==='cmp'){stroke='#00e5ff';fill='#06222b';sw=3;}
    if(st==='swap'){stroke='#ff9f0a';fill='#241803';sw=3.4;}
    if(st==='root'){stroke='#bf5af2';fill='#1a1026';sw=3;}
    if(st==='locked'){stroke='#2f6b41';fill='#0c1f14';}
    if(st==='current'){stroke='#ffd60a';fill='#241d04';sw=3.8;}
    const halo = st==='current'?`<circle cx="${x}" cy="${y}" r="25" fill="none" stroke="#ffd60a" stroke-width="1.3" opacity=".5"/>`:'';
    const idx=`<text class="tbadge" x="${x}" y="${y-26}">${i}</text>`;
    s+=`${halo}${idx}<circle cx="${x}" cy="${y}" r="18" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text class="tnval" x="${x}" y="${y}">${A[i]}</text>`;
  }
  return s+'</svg>';
}
function qpills(label,arr){
  let h=`<div class="qrow"><span class="qlabel">${label}</span>`;
  if(!arr.length) h+=`<span class="qp empty">empty</span>`; else arr.forEach(t=>h+=`<span class="qp">${t}</span>`);
  return h+`</div>`;
}
function heapArr(f){
  const A=f.heap||[];
  const cells=A.map((v,i)=>{
    const st=f.node&&f.node[i];
    let bg='#0e151d',bd='#26303d',cl='#bdf0ff';
    if(st==='cmp'){bg='#06222b';bd='#0e6b80';cl='#bdf0ff';}
    if(st==='swap'){bg='#241803';bd='#ff9f0a';cl='#ffd6a0';}
    if(st==='root'){bg='#1a1026';bd='#7d4ec9';cl='#e6c6ff';}
    if(st==='locked'){bg='#0c1f14';bd='#2f6b41';cl='#8fdba8';}
    if(st==='done'){bg='#0c2417';bd='#69ff47';cl='#c9ffd8';}
    if(st==='current'){bg='#241d04';bd='#ffd60a';cl='#ffe9a8';}
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:3px">`+
      `<span style="font-size:8.5px;color:#586069;font-family:'JetBrains Mono',monospace">${i}</span>`+
      `<span style="min-width:26px;text-align:center;padding:5px 7px;border-radius:7px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:12px;background:${bg};border:1px solid ${bd};color:${cl}">${v}</span></div>`;
  }).join('');
  return `<div class="vtbl" style="flex:1;min-width:100%"><div class="cap">ARRAY VIEW — heap[i], children at 2i+1 / 2i+2</div><div class="qrow" style="gap:6px">${cells||'<span class="qp empty">empty</span>'}</div></div>`;
}
function heapSide(f){
  let html='';
  if(f.stream) html+=qpills('INCOMING →',f.stream);
  if(f.kth!=null) html+=`<div class="cost">k-th largest so far = ${f.kth}</div>`;
  return html;
}

/* ════════════════ FRAME GENERATORS ════════════════ */
function genBuildHeap(){
  const A=[5,3,8,1,9,2,7,6,4], n=A.length, F=[];
  const snap=(line,msg,marks)=>F.push({heap:A.slice(),node:marks||{},msg,line});
  snap(0,`Start with the raw array drawn as a complete binary tree. Min-heapify <b>bottom-up</b> — leaves are already valid heaps.`,{});
  function sift(i){
    while(true){
      let l=2*i+1,r=2*i+2,s=i; const m={};m[i]='current';if(l<n)m[l]='cmp';if(r<n)m[r]='cmp';
      snap(5,`Sift-down index <b>${i}</b> (value ${A[i]}). Compare with children${l<n?` ${A[l]}`:''}${r<n?`, ${A[r]}`:''}.`,m);
      if(l<n&&A[l]<A[s])s=l; if(r<n&&A[r]<A[s])s=r;
      if(s===i){const mm={};mm[i]='done';snap(6,`${A[i]} ≤ both children → this subtree is a valid min-heap.`,mm);break;}
      const ms={};ms[i]='swap';ms[s]='swap';
      snap(7,`Smaller child ${A[s]} &lt; ${A[i]} → swap down and keep sifting.`,ms);
      [A[i],A[s]]=[A[s],A[i]]; i=s;
    }
  }
  for(let i=Math.floor(n/2)-1;i>=0;i--){
    const m={};m[i]='current';
    snap(1,`Last non-leaf is index ${Math.floor(n/2)-1}; walk up to the root. Fixing index <b>${i}</b>.`,m);
    sift(i);
  }
  const done={};A.forEach((_,i)=>done[i]='done');
  snap(-1,`<span class="ok">Min-heap built in O(n)</span> — not O(n log n). Root ${A[0]} is the minimum.`,done);
  return F;
}

function genPush(){
  let A=[1,3,2,6,9,8,7]; const F=[]; const val=0;
  const snap=(line,msg,marks)=>F.push({heap:A.slice(),node:marks||{},msg,line});
  snap(0,`A valid min-heap. Insert <b>${val}</b>: always add at the next array slot to keep the tree complete.`,{});
  A.push(val); let i=A.length-1;
  snap(1,`Placed ${val} at index ${i}. Now <b>sift up</b> while it's smaller than its parent.`,(()=>{const m={};m[i]='current';return m;})());
  while(i>0){
    const par=(i-1)>>1; const m={};m[i]='current';m[par]='cmp';
    snap(2,`Compare ${A[i]} with parent ${A[par]} (index ${par}).`,m);
    if(A[i]>=A[par]){const mm={};mm[i]='done';snap(2,`${A[i]} ≥ ${A[par]} → heap order holds, stop.`,mm);break;}
    const ms={};ms[i]='swap';ms[par]='swap';
    snap(3,`${A[i]} &lt; ${A[par]} → swap up.`,ms);
    [A[i],A[par]]=[A[par],A[i]]; i=par;
  }
  if(i===0){const m={};m[0]='done';snap(4,`Reached the root — ${A[0]} is the new minimum.`,m);}
  const done={};A.forEach((_,k)=>done[k]='done');
  snap(-1,`<span class="ok">Inserted in O(log n).</span> Heap = [${A.join(', ')}].`,done);
  return F;
}

function genPop(){
  let A=[1,3,2,6,9,8,7]; const F=[];
  const snap=(line,msg,marks)=>F.push({heap:A.slice(),node:marks||{},msg,line});
  snap(0,`Extract-min: the answer is always the root <b>${A[0]}</b>.`,{0:'root'});
  const min=A[0], last=A[A.length-1];
  A[0]=last; A.pop();
  snap(1,`Move the last element ${last} to the root and drop the tail. Removed min = ${min}.`,{0:'current'});
  let i=0,n=A.length;
  while(true){
    let l=2*i+1,r=2*i+2,s=i; const m={};m[i]='current';if(l<n)m[l]='cmp';if(r<n)m[r]='cmp';
    snap(3,`Sift-down: compare ${A[i]} with children${l<n?` ${A[l]}`:''}${r<n?`, ${A[r]}`:''}.`,m);
    if(l<n&&A[l]<A[s])s=l; if(r<n&&A[r]<A[s])s=r;
    if(s===i){const mm={};mm[i]='done';snap(6,`${A[i]} ≤ its children → settled.`,mm);break;}
    const ms={};ms[i]='swap';ms[s]='swap';
    snap(5,`Smaller child ${A[s]} &lt; ${A[i]} → swap down.`,ms);
    [A[i],A[s]]=[A[s],A[i]]; i=s;
  }
  const done={};A.forEach((_,k)=>done[k]='done');
  snap(-1,`<span class="ok">Popped ${min} in O(log n).</span> New root (min) = ${A[0]}.`,done);
  return F;
}

function genHeapSort(){
  let A=[4,10,3,5,1,2]; const N=A.length, F=[];
  const snap=(line,msg,marks)=>F.push({heap:A.slice(),node:marks||{},msg,line});
  function sift(i,n){
    while(true){
      let l=2*i+1,r=2*i+2,s=i; const m={};m[i]='current';if(l<n)m[l]='cmp';if(r<n)m[r]='cmp';
      for(let k=n;k<A.length;k++)m[k]='locked';
      snap(4,`Sift-down ${A[i]} in heap of size ${n}: compare with children to keep the <b>max</b> on top.`,m);
      if(l<n&&A[l]>A[s])s=l; if(r<n&&A[r]>A[s])s=r;
      if(s===i)break;
      const ms={};ms[i]='swap';ms[s]='swap';for(let k=n;k<A.length;k++)ms[k]='locked';
      snap(4,`Larger child ${A[s]} &gt; ${A[i]} → swap down.`,ms);
      [A[i],A[s]]=[A[s],A[i]]; i=s;
    }
  }
  snap(0,`Heap sort = build a <b>max</b>-heap, then repeatedly move the max to the back.`,{});
  for(let i=Math.floor(N/2)-1;i>=0;i--)sift(i,N);
  const built={};A.forEach((_,k)=>built[k]='heap');
  snap(1,`Max-heap built — root ${A[0]} is the largest.`,built);
  for(let end=N-1;end>0;end--){
    const m={};m[0]='swap';m[end]='swap';for(let k=end+1;k<A.length;k++)m[k]='locked';
    snap(3,`Swap max ${A[0]} to index ${end} — its final sorted position.`,m);
    [A[0],A[end]]=[A[end],A[0]];
    const ml={};for(let k=end;k<A.length;k++)ml[k]='locked';
    snap(4,`Index ${end} locked into the sorted tail. Shrink the heap to ${end} and sift the new root down.`,ml);
    sift(0,end);
  }
  const done={};A.forEach((_,k)=>done[k]='done');
  snap(-1,`<span class="ok">Sorted in O(n log n), in place.</span> [${A.join(', ')}].`,done);
  return F;
}

function genKth(){
  const nums=[4,5,8,2,3,5,10,9], k=3, F=[]; let A=[];
  const snap=(line,msg,marks,extra)=>F.push(Object.assign({heap:A.slice(),node:marks||{},msg,line},extra||{}));
  function pushH(x){ A.push(x); let i=A.length-1; while(i>0){const p=(i-1)>>1; if(A[i]<A[p]){[A[i],A[p]]=[A[p],A[i]];i=p;}else break;} }
  function popH(){ const mn=A[0]; A[0]=A[A.length-1]; A.pop(); let i=0,n=A.length;
    while(true){let l=2*i+1,r=2*i+2,s=i; if(l<n&&A[l]<A[s])s=l; if(r<n&&A[r]<A[s])s=r; if(s===i)break; [A[i],A[s]]=[A[s],A[i]]; i=s;} return mn; }
  snap(0,`Goal: the <b>${k}rd largest</b> seen so far. Keep a <b>min-heap of size ${k}</b> — its root is the answer.`,{},{stream:nums.slice(),kth:'—'});
  for(let idx=0;idx<nums.length;idx++){
    const x=nums[idx];
    pushH(x); const pos=A.lastIndexOf(x); const m={}; if(pos>=0)m[pos]='current';
    snap(2,`See <b>${x}</b> → push into the heap (size ${A.length}).`,m,{stream:nums.slice(idx+1),kth:A.length>=k?A[0]:'—'});
    if(A.length>k){ const popped=popH(); snap(3,`Size ${A.length+1} &gt; ${k} → pop the smallest (${popped}); too small to be the ${k}rd largest.`,{0:'root'},{stream:nums.slice(idx+1),kth:A[0]}); }
    if(A.length===k){ snap(4,`Top of the size-${k} min-heap = <b>${A[0]}</b> → current ${k}rd largest.`,{0:'root'},{stream:nums.slice(idx+1),kth:A[0]}); }
  }
  const done={};A.forEach((_,i)=>done[i]='done'); done[0]='root';
  snap(-1,`<span class="ok">${k}rd largest = ${A[0]}.</span> Each element costs O(log k), total O(n log k).`,done,{stream:[],kth:A[0]});
  return F;
}

/* ════════════════ SYNTAX HIGHLIGHT ════════════════ */
function hl(code){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return code.split('\n').map(line=>{
    const ci=line.indexOf('//');
    const codePart=ci>=0?line.slice(0,ci):line, comPart=ci>=0?line.slice(ci):'';
    let h=esc(codePart)
      .replace(/\b(class|public|private|struct|int|long|double|void|bool|auto|vector|queue|stack|priority_queue|greater|pair|unordered_map|return|while|for|if|else|true|false|const|new|delete|nullptr|NULL|max|min|abs|reverse|swap|push|pop|top|front|back|empty|size|push_back|pop_back|begin|end)\b/g,'<span class="kw">$1</span>')
      .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
    let cls='cl';
    if(comPart){ cls+=' has-cm'; h+='<span class="cm">'+esc(comPart).replace(/(★[^<]*)/g,'<span class="star">$1</span>')+'</span>'; }
    return `<span class="${cls}"><span class="cmdot">●</span>${h===''?'&nbsp;':h}</span>`;
  }).join('');
}

    <div class="probs"><div class="h">EXAMPLE PROBLEMS</div>${p.problems.map(n=>`<span class="chip">${n}</span>`).join('')}</div>`;

  const codeHtml=`<div class="cb">
      <div class="cbbar"><span class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></span>
        <span class="cbtitle">${p.label.toLowerCase().replace(/[^a-z]+/g,'_').replace(/^_|_$/g,'')}.cpp</span>
        <button class="cbtoggle" id="revealAll">💬 reveal all</button></div>
      <pre>${hl(p.code)}</pre>
      <div class="cbnote">● = this line hides a note — click to reveal, click again to hide.</div>
    </div>`;

  main.innerHTML=`<div class="fade">
    <div class="phead">
      <div>
        <span class="ptag" style="background:${col}22;border:1px solid ${col}55;color:${col}">${CAT[p.cat].label}</span>
        <span class="pcount">Pattern ${active+1} / ${P.length}</span>
        <h2>${p.label}</h2>
        <div class="srcline">${p.src}</div>
      </div>
      <div class="pheadbtns">
        <button class="copy" id="notesBtn">📝 show notes</button>
        <button class="copy" id="varBtn">🔀 variations</button>
        <button class="copy" id="codeBtn">⌨ hide code</button>
        <button class="copy" id="copyBtn">copy code</button>
      </div>
    </div>
    <div class="notesWrap" id="notesWrap" style="display:none">${notes}</div>
    <div class="varWrap" id="varWrap" style="display:none">${varPanel(p)}</div>
    <div class="split" id="split">
      <div class="demo">
        <div class="h">◈ STEP-BY-STEP — ${p.label.toUpperCase()}</div>
        <div class="stage" id="stage"></div>
        <div class="vmsg" id="vmsg"></div>
        <div class="vtables" id="vtables"></div>
        <div class="vctrl">
          <button class="play" id="play">▶ play</button>
          <button id="stepBtn">step ›</button>
          <button id="resetBtn">⟲ reset</button>
          <span class="vpos" id="vpos"></span>
          <span class="spd">speed <input type="range" id="spd" min="280" max="1700" value="950"><b id="spdlbl"></b></span>
        </div>
        <div class="trace"><div class="th">CODE BEING TRACED — <b>active line highlights live</b></div><pre id="trace"></pre></div>
      </div>
      <div class="codeCol">${codeHtml}</div>
    </div>
    <div class="pnav">
      <button id="prevBtn" ${active===0?'disabled':''}>← prev</button>
      <span class="pos">${active+1} of ${P.length}</span>
      <button id="nextBtn" ${active===P.length-1?'disabled':''}>next →</button>
    </div></div>`;
  main.scrollTop=0;

  const nb=main.querySelector('#notesBtn'), nw=main.querySelector('#notesWrap');
  nb.onclick=()=>{const show=nw.style.display==='none';nw.style.display=show?'':'none';nb.textContent=show?'📝 hide notes':'📝 show notes';nb.classList.toggle('done',show);};
  const vb=main.querySelector('#varBtn'), vw=main.querySelector('#varWrap');
  vb.onclick=()=>{const show=vw.style.display==='none';vw.style.display=show?'':'none';vb.textContent=show?'🔀 hide variations':'🔀 variations';vb.classList.toggle('done',show);};
  main.querySelectorAll('.varcopy').forEach(b=>b.onclick=()=>{const v=(VARS[p.label]||[])[+b.dataset.vi];navigator.clipboard.writeText(v.code);b.textContent='✓';setTimeout(()=>b.textContent='copy',1200);});
  const cbtn=main.querySelector('#codeBtn'), split=main.querySelector('#split');
  cbtn.onclick=()=>{const hid=!split.classList.contains('nocode');split.classList.toggle('nocode',hid);cbtn.textContent=hid?'⌨ show code':'⌨ hide code';cbtn.classList.toggle('done',hid);};
  main.querySelector('#copyBtn').onclick=e=>{navigator.clipboard.writeText(p.code);e.target.textContent='✓ copied';e.target.classList.add('done');setTimeout(()=>{e.target.textContent='copy code';e.target.classList.remove('done');},1500);};
  main.querySelector('#prevBtn').onclick=()=>{if(active>0){active--;render();}};
  main.querySelector('#nextBtn').onclick=()=>{if(active<P.length-1){active++;render();}};
  main.querySelectorAll('.cl.has-cm').forEach(el=>el.onclick=()=>el.classList.toggle('reveal'));
  const ra=main.querySelector('#revealAll');
  ra.onclick=()=>{const ls=[...main.querySelector('.cb').querySelectorAll('.cl.has-cm')];const on=ls.some(l=>l.classList.contains('reveal'));ls.forEach(l=>l.classList.toggle('reveal',!on));ra.classList.toggle('on',!on);ra.textContent=on?'💬 reveal all':'🙈 hide all';};

  mountStepper(p);
  buildSidebar();
}

function mountStepper(p){
  const frames=p.gen();
  const stage=main.querySelector('#stage'), vmsg=main.querySelector('#vmsg'),
        vtables=main.querySelector('#vtables'), vpos=main.querySelector('#vpos'),
        traceEl=main.querySelector('#trace'), playBtn=main.querySelector('#play'),
        spd=main.querySelector('#spd'), spdlbl=main.querySelector('#spdlbl');
  const tEls=[]; p.trace.forEach(ln=>{const x=document.createElement('span');x.className='tln';x.innerHTML=hl(ln)||'&nbsp;';traceEl.appendChild(x);tEls.push(x);});
  let idx=0;
  function draw(){
    const f=frames[idx];
    stage.innerHTML=svgHeap(f);
    vmsg.classList.remove('flash');void vmsg.offsetWidth;vmsg.classList.add('flash');
    vmsg.innerHTML=`<span class="stepchip">STEP ${idx+1}</span>${f.msg}`;
    const extra=heapSide(f);
    vtables.innerHTML=heapArr(f)+(extra?`<div style="flex:1;min-width:100%">${extra}</div>`:'');
    tEls.forEach((e,i)=>e.classList.toggle('hot',i===f.line));
    vpos.textContent=`${idx+1} / ${frames.length}`;
  }
  function stop(){if(stepTimer){clearInterval(stepTimer);stepTimer=null;}playBtn.textContent='▶ play';}
  function play(){ if(stepTimer){stop();return;} if(idx>=frames.length-1)idx=0; playBtn.textContent='❚❚ pause';
    stepTimer=setInterval(()=>{ if(idx>=frames.length-1){stop();return;} idx++;draw(); }, +spd.value); }
  const setspd=()=>{spdlbl.textContent=(spd.value/1000).toFixed(2)+'s'; if(stepTimer){clearInterval(stepTimer);stepTimer=setInterval(()=>{if(idx>=frames.length-1){stop();return;}idx++;draw();},+spd.value);}};
  spd.oninput=setspd; setspd();
  playBtn.onclick=play;
  main.querySelector('#stepBtn').onclick=()=>{stop();if(idx<frames.length-1){idx++;draw();}};
  main.querySelector('#resetBtn').onclick=()=>{stop();idx=0;draw();};
  draw();
}

render();

</script>
