<script>
/* ════════════════ LINKED-LIST ENGINE ════════════════ */
function svgList(f){
  const nodes=f.nodes||[], n=nodes.length, cw=46, gap=36, pad=20, top=58;
  const xOf=i=>pad+i*(cw+gap), nullX=xOf(n), W=nullX+40, H=top+74;
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet"><defs>
    <marker id="la" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#7d8895"/></marker>
    <marker id="lab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#bf5af2"/></marker></defs>`;
  const arrows=f.arrows||nodes.map((_,i)=>[i,i+1<n?i+1:-1]);
  arrows.forEach(([a,b])=>{ const ax=xOf(a)+cw, ay=top+22;
    if(b===-1) s+=`<line class="larr" x1="${ax}" y1="${ay}" x2="${nullX-6}" y2="${ay}" marker-end="url(#la)"/>`;
    else if(b>a) s+=`<line class="larr" x1="${ax}" y1="${ay}" x2="${xOf(b)-6}" y2="${ay}" marker-end="url(#la)"/>`;
    else { const sx=xOf(a)+cw/2, bx=xOf(b)+cw/2;
      s+=`<path class="larr back" d="M${sx},${top+44} Q${(sx+bx)/2},${top+92} ${bx},${top+44}" fill="none" marker-end="url(#lab)"/>`; }
  });
  s+=`<rect x="${nullX}" y="${top+6}" width="34" height="30" rx="5" fill="#0b0f15" stroke="#2c3a4c"/><text class="lnull" x="${nullX+17}" y="${top+22}">∅</text>`;
  const ptr=f.ptr||{}, byIdx={};
  Object.entries(ptr).forEach(([nm,idx])=>{ const key=(idx===-1||idx==null)?'NULL':idx; (byIdx[key]=byIdx[key]||[]).push(nm); });
  Object.entries(byIdx).forEach(([k,names])=>{ const cx=k==='NULL'?nullX+17:xOf(+k)+cw/2;
    s+=`<text class="aptr" x="${cx}" y="${top-26}">${names.join(' ')}</text><text class="aptr" x="${cx}" y="${top-12}">▼</text>`; });
  nodes.forEach((v,i)=>{ const st=(f.cells&&f.cells[i])||''; const x=xOf(i);
    let stroke='#3a4658',fill='#10161e';
    if(st==='win'){stroke='#00e5ff';fill='#06222b';}
    if(st==='check'){stroke='#ffd60a';fill='#241d04';}
    if(st==='found'){stroke='#69ff47';fill='#123a1f';}
    if(st==='dead'){stroke='#ff6b6b';fill='#2a0e0e';}
    s+=`<rect class="acell" x="${x}" y="${top+2}" width="${cw}" height="40" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text class="aval" x="${x+cw/2}" y="${top+22}">${v}</text>`; });
  return s+'</svg>';
}
function qpills(label,arr){let h=`<div class="qrow"><span class="qlabel">${label}</span>`;if(!arr.length)h+=`<span class="qp empty">empty</span>`;else arr.forEach(t=>h+=`<span class="qp">${t}</span>`);return h+`</div>`;}
function listSide(f){
  let tables='',heap='';
  if(f.result) heap+=qpills('VALUES →',f.result);
  if(f.stats) f.stats.forEach(([k,v])=>heap+=`<div class="cost">${k} = ${v}</div>`);
  return {tables,heap};
}

/* ════════════════ FRAME GENERATORS ════════════════ */
function genReverse(){
  const nodes=[1,2,3,4,5],F=[]; const nxt={0:1,1:2,2:3,3:4,4:-1};
  const A=()=>Object.entries(nxt).map(([a,b])=>[+a,b]);
  let prev=-1,cur=0;
  const P=()=>{const o={prev,cur};return o;};
  F.push({nodes,arrows:A(),ptr:{prev:-1,cur},cells:{},msg:`prev = NULL, cur = head (1). We flip each arrow to point backwards.`,line:0});
  while(cur!==-1){
    const sv=nxt[cur];
    F.push({nodes,arrows:A(),ptr:{prev,cur,nxt:sv},cells:{[cur]:'check'},msg:`Save nxt = ${sv===-1?'NULL':nodes[sv]} before we overwrite ${nodes[cur]}.next.`,line:2});
    nxt[cur]=prev;
    F.push({nodes,arrows:A(),ptr:{prev,cur,nxt:sv},cells:{[cur]:'win'},msg:`cur.next = prev → ${nodes[cur]} now points ${prev===-1?'to NULL':'back to '+nodes[prev]}.`,line:3});
    prev=cur; cur=sv;
    F.push({nodes,arrows:A(),ptr:{prev,cur},cells:{},msg:`Advance: prev = ${nodes[prev]}, cur = ${cur===-1?'NULL':nodes[cur]}.`,line:4});
  }
  F.push({nodes,arrows:A(),ptr:{prev},cells:Object.fromEntries(nodes.map((_,i)=>[i,'found'])),msg:`<span class="ok">Done — new head = ${nodes[prev]}. List reversed.</span>`,line:5});
  return F;
}
function genCycle(){
  const nodes=[3,2,0,-4],F=[]; const nxt={0:1,1:2,2:3,3:1};
  const A=Object.entries(nxt).map(([a,b])=>[+a,b]);
  let slow=0,fast=0;
  F.push({nodes,arrows:A,ptr:{slow,fast},cells:{[0]:'win'},msg:`slow & fast both start at the head.`,line:0});
  while(true){
    slow=nxt[slow]; fast=nxt[nxt[fast]];
    F.push({nodes,arrows:A,ptr:{slow,fast},cells:{[slow]:'win',[fast]:'check'},msg:`slow → ${nodes[slow]} (1 step), fast → ${nodes[fast]} (2 steps).`,line:3});
    if(slow===fast){F.push({nodes,arrows:A,ptr:{slow,fast},cells:{[slow]:'found'},msg:`<span class="ok">slow == fast → the list has a cycle!</span>`,line:4});break;}
  }
  return F;
}
function genMiddle(){
  const nodes=[1,2,3,4,5],F=[]; const nxt={0:1,1:2,2:3,3:4,4:-1};
  const A=Object.entries(nxt).map(([a,b])=>[+a,b]);
  let slow=0,fast=0;
  F.push({nodes,arrows:A,ptr:{slow,fast},cells:{[0]:'win'},msg:`slow & fast at head. Fast moves twice as fast.`,line:0});
  while(fast!==-1 && nxt[fast]!==-1){
    slow=nxt[slow]; fast=nxt[nxt[fast]];
    F.push({nodes,arrows:A,ptr:{slow,fast},cells:{[slow]:'win',[fast>=0?fast:slow]:'check'},msg:`slow → ${nodes[slow]}, fast → ${fast===-1?'NULL':nodes[fast]}.`,line:2});
  }
  F.push({nodes,arrows:A,ptr:{slow},cells:{[slow]:'found'},msg:`<span class="ok">fast reached the end → slow (${nodes[slow]}) is the middle.</span>`,line:3});
  return F;
}
function genRemoveNth(){
  const nodes=[1,2,3,4,5],n=2,F=[]; const nxt={0:1,1:2,2:3,3:4,4:-1};
  const A=()=>Object.entries(nxt).map(([a,b])=>[+a,b]);
  let fast=0,slow=0;
  F.push({nodes,arrows:A(),ptr:{slow,fast},cells:{},msg:`Goal: remove the ${n}nd node from the end. First send <b>fast</b> ${n} steps ahead.`,line:0});
  for(let i=0;i<n;i++){ fast=nxt[fast]; F.push({nodes,arrows:A(),ptr:{slow,fast},cells:{[fast]:'check'},msg:`fast advances → now at ${nodes[fast]} (gap = ${i+1}).`,line:1}); }
  while(nxt[fast]!==-1){ fast=nxt[fast]; slow=nxt[slow]; F.push({nodes,arrows:A(),ptr:{slow,fast},cells:{[slow]:'win',[fast]:'check'},msg:`Move both until fast is last. slow → ${nodes[slow]}, fast → ${nodes[fast]}.`,line:3}); }
  const tgt=nxt[slow];
  F.push({nodes,arrows:A(),ptr:{slow},cells:{[tgt]:'dead'},msg:`fast is last → slow.next (${nodes[tgt]}) is the node to drop.`,line:4});
  nxt[slow]=nxt[tgt];
  F.push({nodes,arrows:A(),ptr:{slow},cells:{[tgt]:'dead'},msg:`<span class="ok">slow.next = slow.next.next → ${nodes[tgt]} unlinked.</span>`,line:4});
  return F;
}
function genRemoveDup(){
  const nodes=[1,1,2,3,3],F=[]; const nxt={0:1,1:2,2:3,3:4,4:-1};
  const A=()=>Object.entries(nxt).map(([a,b])=>[+a,b]);
  let cur=0;
  F.push({nodes,arrows:A(),ptr:{cur},cells:{},msg:`Sorted list → duplicates are adjacent. Walk with cur.`,line:0});
  while(nxt[cur]!==-1){
    const nx=nxt[cur];
    if(nodes[nx]===nodes[cur]){ nxt[cur]=nxt[nx]; F.push({nodes,arrows:A(),ptr:{cur},cells:{[nx]:'dead',[cur]:'win'},msg:`${nodes[nx]} == ${nodes[cur]} → skip it: cur.next = cur.next.next.`,line:3}); }
    else { cur=nx; F.push({nodes,arrows:A(),ptr:{cur},cells:{[cur]:'check'},msg:`${nodes[cur]} differs → advance cur.`,line:4}); }
  }
  F.push({nodes,arrows:A(),ptr:{},cells:{0:'found',2:'found',3:'found'},msg:`<span class="ok">Done — each value appears once.</span>`,line:-1});
  return F;
}
function genPalindrome(){
  const nodes=[1,2,3,2,1],F=[],vals=[]; const A=nodes.map((_,i)=>[i,i+1<nodes.length?i+1:-1]);
  for(let i=0;i<nodes.length;i++){ vals.push(nodes[i]); F.push({nodes,arrows:A,ptr:{cur:i},cells:{[i]:'check'},result:vals.slice(),msg:`Copy values out (or use fast/slow): read ${nodes[i]}.`,line:1}); }
  let l=0,r=nodes.length-1;
  while(l<r){
    if(nodes[l]!==nodes[r]){ F.push({nodes,arrows:A,ptr:{L:l,R:r},cells:{[l]:'dead',[r]:'dead'},result:vals.slice(),msg:`<span class="bad">${nodes[l]} ≠ ${nodes[r]} → not a palindrome.</span>`,line:4}); return F; }
    F.push({nodes,arrows:A,ptr:{L:l,R:r},cells:{[l]:'win',[r]:'win'},result:vals.slice(),msg:`${nodes[l]} == ${nodes[r]} ✓ — move both inward.`,line:4});
    l++; r--;
  }
  F.push({nodes,arrows:A,ptr:{},cells:Object.fromEntries(nodes.map((_,i)=>[i,'found'])),result:vals.slice(),msg:`<span class="ok">All mirror pairs match → palindrome!</span>`,line:5});
  return F;
}

/* ════════════════ SYNTAX HIGHLIGHT ════════════════ */
function hl(code){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return code.split('\n').map(line=>{
    const ci=line.indexOf('//');
    const codePart=ci>=0?line.slice(0,ci):line, comPart=ci>=0?line.slice(ci):'';
    let h=esc(codePart)
      .replace(/\b(ListNode|class|struct|int|long|void|bool|auto|vector|unordered_set|unordered_map|return|while|for|do|if|else|true|false|const|nullptr|NULL|new|max|min|swap|push|insert|count|next)\b/g,'<span class="kw">$1</span>')
      .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
    let cls='cl';
    if(comPart){ cls+=' has-cm'; h+='<span class="cm">'+esc(comPart).replace(/(★[^<]*)/g,'<span class="star">$1</span>')+'</span>'; }
    return `<span class="${cls}"><span class="cmdot">●</span>${h===''?'&nbsp;':h}</span>`;
  }).join('');
}
function varPanel(p){
  const vs=VARS[p.label]||[];
  if(!vs.length) return '';
  return `<div class="varhead">🔀 VARIATION TEMPLATES — same skeleton, small twists</div>`+
    vs.map((v,i)=>`<div class="cb varcb">
      <div class="cbbar"><span class="vtag">VARIATION ${i+1}</span><span class="cbtitle">${v.name}</span><button class="cbtoggle varcopy" data-vi="${i}">copy</button></div>
      <div class="varwhen">${v.when}</div>
      <pre>${hl(v.code)}</pre>
    </div>`).join('');
}

  const cbtn=main.querySelector('#codeBtn'), split=main.querySelector('#split');
  cbtn.onclick=()=>{const hid=!split.classList.contains('nocode');split.classList.toggle('nocode',hid);cbtn.textContent=hid?'⌨ show code':'⌨ hide code';cbtn.classList.toggle('done',hid);};
  main.querySelector('#copyBtn').onclick=e=>{navigator.clipboard.writeText(p.code);e.target.textContent='✓ copied';e.target.classList.add('done');setTimeout(()=>{e.target.textContent='copy code';e.target.classList.remove('done');},1500);};
  main.querySelector('#prevBtn').onclick=()=>{if(active>0){active--;render();}};
  main.querySelector('#nextBtn').onclick=()=>{if(active<P.length-1){active++;render();}};
  main.querySelectorAll('.cl.has-cm').forEach(el=>el.onclick=()=>el.classList.toggle('reveal'));
  const ra=main.querySelector('#revealAll');
  ra.onclick=()=>{const ls=[...main.querySelector('.cb').querySelectorAll('.cl.has-cm')];const on=ls.some(l=>l.classList.contains('reveal'));ls.forEach(l=>l.classList.toggle('reveal',!on));ra.classList.toggle('on',!on);ra.textContent=on?'💬 reveal all':'🙈 hide all';};
  mountStepper(p);
  buildSidebar();
}

function mountStepper(p){
  const frames=p.gen();
  const stage=main.querySelector('#stage'), vmsg=main.querySelector('#vmsg'),
        vtables=main.querySelector('#vtables'), vpos=main.querySelector('#vpos'),
        traceEl=main.querySelector('#trace'), playBtn=main.querySelector('#play'),
        spd=main.querySelector('#spd'), spdlbl=main.querySelector('#spdlbl');
  const tEls=[]; p.trace.forEach(ln=>{const x=document.createElement('span');x.className='tln';x.innerHTML=hl(ln)||'&nbsp;';traceEl.appendChild(x);tEls.push(x);});
  let idx=0;
  function draw(){
    const f=frames[idx];
    stage.innerHTML=svgList(f);
    vmsg.classList.remove('flash');void vmsg.offsetWidth;vmsg.classList.add('flash');
    vmsg.innerHTML=`<span class="stepchip">STEP ${idx+1}</span>${f.msg}`;
    const sp=listSide(f);
    vtables.innerHTML=(sp.heap?`<div style="flex:1;min-width:100%">${sp.heap}</div>`:'')+sp.tables;
    tEls.forEach((e,i)=>e.classList.toggle('hot',i===f.line));
    vpos.textContent=`${idx+1} / ${frames.length}`;
  }
  function stop(){if(stepTimer){clearInterval(stepTimer);stepTimer=null;}playBtn.textContent='▶ play';}
  function play(){ if(stepTimer){stop();return;} if(idx>=frames.length-1)idx=0; playBtn.textContent='❚❚ pause';
    stepTimer=setInterval(()=>{ if(idx>=frames.length-1){stop();return;} idx++;draw(); }, +spd.value); }
  const setspd=()=>{spdlbl.textContent=(spd.value/1000).toFixed(2)+'s'; if(stepTimer){clearInterval(stepTimer);stepTimer=setInterval(()=>{if(idx>=frames.length-1){stop();return;}idx++;draw();},+spd.value);}};
  spd.oninput=setspd; setspd();
  playBtn.onclick=play;
  main.querySelector('#stepBtn').onclick=()=>{stop();if(idx<frames.length-1){idx++;draw();}};
  main.querySelector('#resetBtn').onclick=()=>{stop();idx=0;draw();};
  draw();
}

render();
</script>
