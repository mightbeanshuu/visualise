<script>
/* ════════════════ STACK / QUEUE ENGINE ════════════════ */
function svgSeq(f){
  const seq=f.seq||[], n=seq.length, bars=f.mode==='bars';
  const cw=44, gap=10, pad=20, top=46, barMax=120;
  const xOf=i=>pad+i*(cw+gap);
  const maxH=bars?Math.max(1,...seq):1;
  const baseY=bars?top+barMax+6:top+44;
  const W=Math.max(xOf(n)-gap+pad, 160), H=baseY+26;
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  const ptr=f.ptr||{}, byIdx={};
  Object.entries(ptr).forEach(([nm,idx])=>{ if(idx==null||idx<0||idx>=n)return; (byIdx[idx]=byIdx[idx]||[]).push(nm); });
  Object.entries(byIdx).forEach(([k,names])=>{ const cx=xOf(+k)+cw/2;
    s+=`<text class="aptr" x="${cx}" y="${top-22}">${names.join(' ')}</text><text class="aptr" x="${cx}" y="${top-8}">▼</text>`; });
  seq.forEach((v,i)=>{ const st=(f.cells&&f.cells[i])||''; const x=xOf(i);
    let stroke='#3a4658',fill='#10161e';
    if(st==='win'){stroke='#00e5ff';fill='#06222b';}
    if(st==='check'){stroke='#ffd60a';fill='#241d04';}
    if(st==='found'){stroke='#69ff47';fill='#123a1f';}
    if(st==='dead'){stroke='#ff6b6b';fill='#2a0e0e';}
    if(st==='pop'){stroke='#bf5af2';fill='#1e0f2a';}
    if(bars){ const h=Math.max(6, v/maxH*barMax);
      s+=`<rect class="acell" x="${x}" y="${baseY-h}" width="${cw}" height="${h}" rx="5" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
      s+=`<text class="aval" x="${x+cw/2}" y="${baseY-h-10}">${v}</text>`;
    } else {
      s+=`<rect class="acell" x="${x}" y="${top+2}" width="${cw}" height="40" rx="9" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
      s+=`<text class="aval" x="${x+cw/2}" y="${top+22}">${v}</text>`;
    }
    s+=`<text class="aidx" x="${x+cw/2}" y="${baseY+16}">${i}</text>`;
  });
  return s+'</svg>';
}
function qpills(label,arr){let h=`<div class="qrow"><span class="qlabel">${label}</span>`;if(!arr.length)h+=`<span class="qp empty">empty</span>`;else arr.forEach(t=>h+=`<span class="qp">${t}</span>`);return h+`</div>`;}
function stackPills(label,arr){let h=`<div class="qrow"><span class="qlabel">${label}</span>`;if(!arr.length)h+=`<span class="qp empty">empty</span>`;else arr.forEach((t,i)=>h+=`<span class="qp${i===arr.length-1?' top':''}">${t}</span>`);return h+`</div>`;}
function seqSide(f){
  let tables='',heap='';
  if(f.stack!==undefined) heap+=stackPills(f.s1lbl||'STACK (top →)',f.stack);
  if(f.stack2!==undefined) heap+=stackPills(f.s2lbl||'MIN (top →)',f.stack2);
  if(f.queue!==undefined) heap+=qpills(f.qlbl||'DEQUE (front → back)',f.queue);
  if(f.result!==undefined) heap+=qpills(f.rlbl||'OUTPUT →',f.result);
  if(f.stats) f.stats.forEach(([k,v])=>heap+=`<div class="cost">${k} = ${v}</div>`);
  return {tables,heap};
}

/* ════════════════ FRAME GENERATORS ════════════════ */
function genValidParens(){
  const seq=['{','[','(',')',']','}'],F=[];
  const open={'(':')','[':']','{':'}'}, close={')':'(',']':'[','}':'{'};
  let st=[];
  F.push({seq,cells:{},ptr:{},stack:[],msg:`Scan left → right. Push every opening bracket; each closing must match the most-recent open (the top).`,line:0});
  for(let i=0;i<seq.length;i++){
    const c=seq[i];
    if(open[c]){ st.push(c); F.push({seq,cells:{[i]:'check'},ptr:{c:i},stack:st.slice(),msg:`<b>${c}</b> is opening → push onto the stack.`,line:1}); }
    else {
      if(!st.length || st[st.length-1]!==close[c]){ F.push({seq,cells:{[i]:'dead'},ptr:{c:i},stack:st.slice(),msg:`<span class="bad">${c} doesn't match the top → invalid.</span>`,line:2}); return F; }
      const t=st.pop();
      F.push({seq,cells:{[i]:'win'},ptr:{c:i},stack:st.slice(),msg:`<b>${c}</b> closes <b>${t}</b> on top → pop it.`,line:3});
    }
  }
  F.push({seq,cells:Object.fromEntries(seq.map((_,i)=>[i,'found'])),ptr:{},stack:st.slice(),msg:`<span class="ok">Stack empty at the end → every bracket matched. Valid!</span>`,line:5});
  return F;
}
function genMinStack(){
  const seq=[5,2,7,1],F=[];
  let st=[],mn=[];
  F.push({seq,cells:{},ptr:{},stack:[],stack2:[],msg:`A Min Stack keeps a parallel "min so far" stack, so getMin() is O(1).`,line:0});
  for(let i=0;i<seq.length;i++){
    const x=seq[i]; st.push(x);
    const m=mn.length?Math.min(x,mn[mn.length-1]):x; mn.push(m);
    F.push({seq,cells:{[i]:'check'},ptr:{push:i},stack:st.slice(),stack2:mn.slice(),msg:`push(${x}) → also push min(${x}, prevMin) = <b>${m}</b> to the min stack.`,line:2});
  }
  F.push({seq,cells:{},ptr:{},stack:st.slice(),stack2:mn.slice(),stats:[['getMin()',mn[mn.length-1]]],msg:`getMin() → just read the min-stack top = <b>${mn[mn.length-1]}</b>. No scan.`,line:4});
  st.pop();mn.pop();
  F.push({seq,cells:{[seq.length-1]:'pop'},ptr:{},stack:st.slice(),stack2:mn.slice(),stats:[['getMin()',mn[mn.length-1]]],msg:`pop() removes the top of <b>both</b> stacks → getMin now = <b>${mn[mn.length-1]}</b>.`,line:3});
  F.push({seq,cells:{},ptr:{},stack:st.slice(),stack2:mn.slice(),stats:[['getMin()',mn[mn.length-1]]],msg:`<span class="ok">Min is always the min-stack top — O(1) push / pop / getMin.</span>`,line:4});
  return F;
}
function genRPN(){
  const seq=['2','1','+','3','*'],F=[];
  const isNum=t=>/^-?\d+$/.test(t);
  const ap=(a,o,b)=>o==='+'?a+b:o==='-'?a-b:o==='*'?a*b:Math.trunc(a/b);
  let st=[];
  F.push({seq,cells:{},ptr:{},stack:[],msg:`Reverse Polish Notation: a number is pushed; an operator pops the top two operands.`,line:0});
  for(let i=0;i<seq.length;i++){
    const t=seq[i];
    if(isNum(t)){ st.push(+t); F.push({seq,cells:{[i]:'check'},ptr:{t:i},stack:st.slice(),msg:`<b>${t}</b> is a number → push.`,line:1}); }
    else { const b=st.pop(), a=st.pop(), r=ap(a,t,b); st.push(r);
      F.push({seq,cells:{[i]:'win'},ptr:{t:i},stack:st.slice(),msg:`Operator <b>${t}</b> → pop ${b} & ${a}, push ${a} ${t} ${b} = <b>${r}</b>.`,line:5}); }
  }
  F.push({seq,cells:Object.fromEntries(seq.map((_,i)=>[i,'found'])),ptr:{},stack:st.slice(),stats:[['result',st[0]]],msg:`<span class="ok">One value left = the answer = ${st[0]}.</span>`,line:7});
  return F;
}

  let dq=[],res=[];
  const pills=()=>dq.map(i=>seq[i]);
  const win=i=>{const o={};for(let j=Math.max(0,i-k+1);j<=i;j++)o[j]='win';return o;};
  F.push({seq,cells:{},ptr:{},queue:[],result:[],rlbl:`MAX of each window →`,msg:`Deque holds indices whose values could still be a window max — kept decreasing.`,line:0});
  for(let i=0;i<n;i++){

    while(dq.length && seq[dq[dq.length-1]]<=seq[i]){ const b=dq.pop(); F.push({seq,cells:win(i),ptr:{i},queue:pills(),result:res.slice(),rlbl:`MAX of each window →`,msg:`${seq[i]} ≥ ${seq[b]} → ${seq[b]} can never be max again, pop_back.`,line:3}); }
    dq.push(i);

  {name:'Basic Calculator with parens (LC 224)',when:'Stack saves (result, sign) on "(" and restores on ")".',code:
`stack<int> st; int res=0,sign=1,num=0;

/* ════════════════ SYNTAX HIGHLIGHT ════════════════ */
function hl(code){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return code.split('\n').map(line=>{
    const ci=line.indexOf('//');
    const codePart=ci>=0?line.slice(0,ci):line, comPart=ci>=0?line.slice(ci):'';
    let h=esc(codePart)
      .replace(/\b(stack|queue|deque|priority_queue|class|struct|public|private|int|long|void|bool|auto|char|string|vector|pair|set|map|return|while|for|do|if|else|true|false|const|nullptr|NULL|new|max|min|push|pop|top|front|back|empty|size|push_back|pop_back|push_front|pop_front|stoi|isdigit|INT_MAX)\b/g,'<span class="kw">$1</span>')
      .replace(/('[^']*')/g,'<span class="str">$1</span>')
      .replace(/&quot;[^&]*&quot;/g,m=>'<span class="str">'+m+'</span>')
      .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
    let cls='cl';
    if(comPart){ cls+=' has-cm'; h+='<span class="cm">'+esc(comPart).replace(/(★[^<]*)/g,'<span class="star">$1</span>')+'</span>'; }
    return `<span class="${cls}"><span class="cmdot">●</span>${h===''?'&nbsp;':h}</span>`;
  }).join('');
}
function varPanel(p){
  const vs=VARS[p.label]||[];
  if(!vs.length) return '';
  return `<div class="varhead">🔀 VARIATION TEMPLATES — same skeleton, small twists</div>`+
    vs.map((v,i)=>`<div class="cb varcb">
      <div class="cbbar"><span class="vtag">VARIATION ${i+1}</span><span class="cbtitle">${v.name}</span><button class="cbtoggle varcopy" data-vi="${i}">copy</button></div>
      <div class="varwhen">${v.when}</div>
      <pre>${hl(v.code)}</pre>
    </div>`).join('');
}

/* ════════════════ RENDER ════════════════ */
const side=document.getElementById('side'), main=document.getElementById('main');
let active=0, stepTimer=null;
document.getElementById('menuToggle').onclick=()=>side.classList.toggle('open');

function buildSidebar(){
  const groups=[]; let cur=null;
  P.forEach((p,i)=>{ if(!cur||cur.cat!==p.cat){cur={cat:p.cat,items:[]};groups.push(cur);} cur.items.push({p,i}); });
  let html='';
  groups.forEach(g=>{ const c=CAT[g.cat].c;
    html+=`<div class="catlabel" style="color:${c}">${CAT[g.cat].label}<span class="catn">${g.items.length}</span></div>`+
    g.items.map(({p,i})=>`<div class="navitem ${i===active?'on':''}" data-i="${i}" style="${i===active?'border-left-color:'+c:''}">
        <div class="tag" style="color:${c}">${CAT[p.cat].label}</div><div class="nm">${p.label}</div></div>`).join('');
  });
  side.innerHTML=html;
  side.querySelectorAll('.navitem').forEach(el=>el.onclick=()=>{active=+el.dataset.i;render();if(window.innerWidth<=860)side.classList.remove('open');});
}

function render(){
  if(stepTimer){clearInterval(stepTimer);stepTimer=null;}
  const p=P[active], col=CAT[p.cat].c;
  const notes=`<div class="cards">
      <div class="ic"><div class="h">WHEN TO USE</div><p>${p.when}</p></div>
      <div class="ic" style="border-color:${col}33"><div class="h" style="color:${col}">★ KEY INSIGHT</div><p>${p.insight}</p></div>
      <div class="ic analogy"><div class="h" style="color:${col}">◈ ANALOGY / MENTAL MODEL</div><p>${p.analogy}</p></div>
      <div class="ic bugs"><div class="h">⚠ BUGS YOU ACTUALLY HIT</div><ul>${p.bugs.map(b=>`<li>${b}</li>`).join('')}</ul></div>
    </div>
    <div class="probs"><div class="h">LEETCODE PROBLEMS</div>${p.problems.map(n=>`<span class="chip">${n}</span>`).join('')}</div>`;
  const codeHtml=`<div class="cb">
      <div class="cbbar"><span class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></span>
        <span class="cbtitle">${p.label.toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')}.cpp</span>
        <button class="cbtoggle" id="revealAll">💬 reveal all</button></div>
      <pre>${hl(p.code)}</pre>
      <div class="cbnote">● = this line hides a note — click to reveal, click again to hide.</div>
    </div>`;
  main.innerHTML=`<div class="fade">
    <div class="phead">
      <div>
        <span class="ptag" style="background:${col}22;border:1px solid ${col}55;color:${col}">${CAT[p.cat].label}</span>
        <span class="pcount">Pattern ${active+1} / ${P.length}</span>
        <h2>${p.label}</h2>
        <div class="srcline">${p.src}</div>
      </div>
      <div class="pheadbtns">
        <button class="copy" id="notesBtn">📝 show notes</button>
        <button class="copy" id="varBtn">🔀 variations</button>
        <button class="copy" id="codeBtn">⌨ hide code</button>
        <button class="copy" id="copyBtn">copy code</button>
      </div>
    </div>
    <div class="notesWrap" id="notesWrap" style="display:none">${notes}</div>
    <div class="varWrap" id="varWrap" style="display:none">${varPanel(p)}</div>
    <div class="split" id="split">
      <div class="demo">
        <div class="h">◈ STEP-BY-STEP — ${p.label.toUpperCase()}</div>
        <div class="stage" id="stage"></div>
        <div class="vmsg" id="vmsg"></div>
        <div class="vtables" id="vtables"></div>
        <div class="vctrl">
          <button class="play" id="play">▶ play</button>
          <button id="stepBtn">step ›</button>
          <button id="resetBtn">⟲ reset</button>
          <span class="vpos" id="vpos"></span>
          <span class="spd">speed <input type="range" id="spd" min="280" max="1700" value="950"><b id="spdlbl"></b></span>
        </div>
        <div class="trace"><div class="th">CODE BEING TRACED — <b>active line highlights live</b></div><pre id="trace"></pre></div>
      </div>
      <div class="codeCol">${codeHtml}</div>
    </div>
    <div class="pnav">
      <button id="prevBtn" ${active===0?'disabled':''}>← prev</button>
      <span class="pos">${active+1} of ${P.length}</span>
      <button id="nextBtn" ${active===P.length-1?'disabled':''}>next →</button>
    </div></div>`;
  main.scrollTop=0;
  const nb=main.querySelector('#notesBtn'), nw=main.querySelector('#notesWrap');
  nb.onclick=()=>{const show=nw.style.display==='none';nw.style.display=show?'':'none';nb.textContent=show?'📝 hide notes':'📝 show notes';nb.classList.toggle('done',show);};
  const vb=main.querySelector('#varBtn'), vw=main.querySelector('#varWrap');
  vb.onclick=()=>{const show=vw.style.display==='none';vw.style.display=show?'':'none';vb.textContent=show?'🔀 hide variations':'🔀 variations';vb.classList.toggle('done',show);};
  main.querySelectorAll('.varcopy').forEach(b=>b.onclick=()=>{const v=(VARS[p.label]||[])[+b.dataset.vi];navigator.clipboard.writeText(v.code);b.textContent='✓';setTimeout(()=>b.textContent='copy',1200);});
  const cbtn=main.querySelector('#codeBtn'), split=main.querySelector('#split');
  cbtn.onclick=()=>{const hid=!split.classList.contains('nocode');split.classList.toggle('nocode',hid);cbtn.textContent=hid?'⌨ show code':'⌨ hide code';cbtn.classList.toggle('done',hid);};
  main.querySelector('#copyBtn').onclick=e=>{navigator.clipboard.writeText(p.code);e.target.textContent='✓ copied';e.target.classList.add('done');setTimeout(()=>{e.target.textContent='copy code';e.target.classList.remove('done');},1500);};
  main.querySelector('#prevBtn').onclick=()=>{if(active>0){active--;render();}};
  main.querySelector('#nextBtn').onclick=()=>{if(active<P.length-1){active++;render();}};
  main.querySelectorAll('.cl.has-cm').forEach(el=>el.onclick=()=>el.classList.toggle('reveal'));
  const ra=main.querySelector('#revealAll');
  ra.onclick=()=>{const ls=[...main.querySelector('.cb').querySelectorAll('.cl.has-cm')];const on=ls.some(l=>l.classList.contains('reveal'));ls.forEach(l=>l.classList.toggle('reveal',!on));ra.classList.toggle('on',!on);ra.textContent=on?'💬 reveal all':'🙈 hide all';};
  mountStepper(p);
  buildSidebar();
}

function mountStepper(p){
  const frames=p.gen();
  const stage=main.querySelector('#stage'), vmsg=main.querySelector('#vmsg'),
        vtables=main.querySelector('#vtables'), vpos=main.querySelector('#vpos'),
        traceEl=main.querySelector('#trace'), playBtn=main.querySelector('#play'),
        spd=main.querySelector('#spd'), spdlbl=main.querySelector('#spdlbl');
  const tEls=[]; p.trace.forEach(ln=>{const x=document.createElement('span');x.className='tln';x.innerHTML=hl(ln)||'&nbsp;';traceEl.appendChild(x);tEls.push(x);});
  let idx=0;
  function draw(){
    const f=frames[idx];
    stage.innerHTML=svgSeq(f);
    vmsg.classList.remove('flash');void vmsg.offsetWidth;vmsg.classList.add('flash');
    vmsg.innerHTML=`<span class="stepchip">STEP ${idx+1}</span>${f.msg}`;
    const sp=seqSide(f);
    vtables.innerHTML=(sp.heap?`<div style="flex:1;min-width:100%">${sp.heap}</div>`:'')+sp.tables;
    tEls.forEach((e,i)=>e.classList.toggle('hot',i===f.line));
    vpos.textContent=`${idx+1} / ${frames.length}`;
  }
  function stop(){if(stepTimer){clearInterval(stepTimer);stepTimer=null;}playBtn.textContent='▶ play';}
  function play(){ if(stepTimer){stop();return;} if(idx>=frames.length-1)idx=0; playBtn.textContent='❚❚ pause';
    stepTimer=setInterval(()=>{ if(idx>=frames.length-1){stop();return;} idx++;draw(); }, +spd.value); }
  const setspd=()=>{spdlbl.textContent=(spd.value/1000).toFixed(2)+'s'; if(stepTimer){clearInterval(stepTimer);stepTimer=setInterval(()=>{if(idx>=frames.length-1){stop();return;}idx++;draw();},+spd.value);}};
  spd.oninput=setspd; setspd();
  playBtn.onclick=play;
  main.querySelector('#stepBtn').onclick=()=>{stop();if(idx<frames.length-1){idx++;draw();}};
  main.querySelector('#resetBtn').onclick=()=>{stop();idx=0;draw();};
  draw();
}

render();
