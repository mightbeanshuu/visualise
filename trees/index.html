<script>
/* ════════════════ SAMPLE TREE (a valid BST so BST patterns work too) ════════════════
        8
      /   \
     4      12
    / \    /  \
   2   6  10   14
  /     \
 1       7
*/
const TREE=[
  {val:8, l:1, r:2},  // 0
  {val:4, l:3, r:4},  // 1
  {val:12,l:5, r:6},  // 2
  {val:2, l:7, r:-1}, // 3
  {val:6, l:-1,r:8},  // 4
  {val:10,l:-1,r:-1}, // 5
  {val:14,l:-1,r:-1}, // 6
  {val:1, l:-1,r:-1}, // 7
  {val:7, l:-1,r:-1}, // 8
];
const byVal=v=>TREE.findIndex(n=>n.val===v);

/* layout: x by in-order slot, y by depth */
const POS=(function(){
  let idx=0; const X={},D={}; let maxD=0;
  (function io(id,d){ if(id<0)return; io(TREE[id].l,d+1); X[id]=idx++; D[id]=d; if(d>maxD)maxD=d; io(TREE[id].r,d+1); })(0,0);
  const n=idx,W=522,H=292,padX=40,padY=32,pos={};
  Object.keys(X).forEach(id=>{ pos[id]=[ padX+(n===1?0.5:X[id]/(n-1))*(W-2*padX), padY+(maxD===0?0.5:D[id]/maxD)*(H-2*padY) ]; });
  return pos;
})();

/* ════════════════ FRAME GENERATORS ════════════════ */
function genDFS(order,L){
  const F=[],res=[],resSet=new Set(),stack=[];
  const snap=(cur,line,msg)=>{const node={};stack.forEach(id=>node[id]='stack');resSet.forEach(id=>{if(node[id]!=='current')node[id]='done';});if(cur>=0)node[cur]='current';
    F.push({node,result:res.slice(),stack:stack.map(id=>TREE[id].val),msg,line});};
  function rec(id){
    if(id<0) return;
    stack.push(id);
    if(order==='pre'){res.push(TREE[id].val);resSet.add(id);snap(id,L.visit,`Visit <b>${TREE[id].val}</b> first (root before children) → result [${res.join(', ')}].`);}
    else snap(id,L.base,`Enter <b>${TREE[id].val}</b> (not null, keep going).`);
    if(TREE[id].l>=0){snap(id,L.left,`${TREE[id].val}: recurse <b>left</b>.`);rec(TREE[id].l);}
    if(order==='in'){res.push(TREE[id].val);resSet.add(id);snap(id,L.visit,`Left subtree done → visit <b>${TREE[id].val}</b> → result [${res.join(', ')}].`);}
    if(TREE[id].r>=0){snap(id,L.right,`${TREE[id].val}: recurse <b>right</b>.`);rec(TREE[id].r);}
    if(order==='post'){res.push(TREE[id].val);resSet.add(id);snap(id,L.visit,`Both children done → visit <b>${TREE[id].val}</b> (root last) → result [${res.join(', ')}].`);}
    stack.pop();
    snap(stack.length?stack[stack.length-1]:-1,L.ret,`Return from ${TREE[id].val} — pop the call stack.`);
  }
  rec(0);
  snap(-1,-1,`<span class="ok">Done.</span> ${order}-order = [${res.join(', ')}].`);
  return F;
}

function genLevel(){
  const F=[],levels=[],done=new Set(); let q=[0];
  const snap=(cur,line,msg)=>{const node={};done.forEach(id=>node[id]='done');q.forEach(id=>{if(!node[id])node[id]='stack';});if(cur>=0)node[cur]='current';
    F.push({node,fifo:q.map(id=>TREE[id].val),levels:levels.map(l=>l.slice()),msg,line});};
  snap(-1,0,`Push the root into the queue.`);
  while(q.length){
    const sz=q.length, level=[];
    snap(-1,2,`New level — snapshot queue size = <b>${sz}</b>, process exactly that many.`);
    for(let i=0;i<sz;i++){
      const id=q.shift(); level.push(TREE[id].val); done.add(id);
      const kids=[]; if(TREE[id].l>=0){q.push(TREE[id].l);kids.push(TREE[TREE[id].l].val);} if(TREE[id].r>=0){q.push(TREE[id].r);kids.push(TREE[TREE[id].r].val);}
      snap(id,5,`Pop <b>${TREE[id].val}</b> → row ${levels.length}. ${kids.length?`Enqueue children ${kids.join(', ')}.`:'Leaf — nothing to enqueue.'}`);
    }
    levels.push(level);
    snap(-1,9,`Level ${levels.length-1} complete: [${level.join(', ')}].`);
  }
  snap(-1,-1,`<span class="ok">Done.</span> levels = [${levels.map(l=>'['+l.join(',')+']').join(', ')}].`);
  return F;
}

function genHeight(){
  const F=[],h={};
  const snap=(cur,line,msg)=>{const node={};Object.keys(h).forEach(id=>node[id]='done');if(cur>=0)node[cur]='current';F.push({node,heights:Object.assign({},h),msg,line});};
  function rec(id){
    if(id<0) return 0;
    snap(id,0,`At <b>${TREE[id].val}</b> — its height = 1 + max(left height, right height). Dive down first.`);
    const l=rec(TREE[id].l), r=rec(TREE[id].r);
    h[id]=1+Math.max(l,r);
    snap(id,4,`<b>${TREE[id].val}</b>: left=${l}, right=${r} ⇒ height = <b>${h[id]}</b> (returned up).`);
    return h[id];
  }
  const ans=rec(0);
  snap(-1,-1,`<span class="ok">Max depth / height = ${ans}.</span>`);
  return F;
}

function genDiameter(){
  const F=[]; let best=0; const h={};
  const snap=(cur,line,msg)=>{const node={};Object.keys(h).forEach(id=>node[id]='done');if(cur>=0)node[cur]='current';F.push({node,heights:Object.assign({},h),best,msg,line});};
  function rec(id){
    if(id<0) return 0;
    snap(id,3,`At <b>${TREE[id].val}</b>: compute child depths.`);
    const l=rec(TREE[id].l), r=rec(TREE[id].r);
    best=Math.max(best,l+r); h[id]=1+Math.max(l,r);
    snap(id,4,`<b>${TREE[id].val}</b>: path through it = left+right = ${l}+${r} = <b>${l+r}</b>. best = <b>${best}</b>. Return depth ${h[id]}.`);
    return h[id];
  }
  rec(0);
  snap(-1,-1,`<span class="ok">Diameter = ${best} edges.</span>`);
  return F;
}

function genPathSum(target){
  const F=[],path=[]; let found=false;
  const snap=(cur,line,msg,rem)=>{const node={};path.forEach(id=>node[id]='path');if(cur>=0)node[cur]=found?'found':'current';F.push({node,pathVals:path.map(id=>TREE[id].val),remaining:rem,msg,line});};
  function rec(id,rem){
    if(id<0) return false;
    path.push(id); const before=rem; rem-=TREE[id].val;
    const leaf=TREE[id].l<0&&TREE[id].r<0;
    snap(id,2,`At <b>${TREE[id].val}</b>: remaining ${before} − ${TREE[id].val} = <b>${rem}</b>.`,rem);
    if(leaf){
      if(rem===0){found=true;snap(id,3,`<span class="ok">Leaf and remaining is 0 → path found!</span> ${path.map(i=>TREE[i].val).join(' → ')}.`,rem);path.pop();return true;}
      snap(id,3,`Leaf but remaining ${rem} ≠ 0 → dead end, backtrack.`,rem);path.pop();return false;
    }
    if(rec(TREE[id].l,rem)){path.pop();return true;}
    if(rec(TREE[id].r,rem)){path.pop();return true;}
    snap(id,4,`Neither subtree of ${TREE[id].val} worked → backtrack.`,before-TREE[id].val);
    path.pop(); return false;
  }
  rec(0,target);
  return F;
}

function genLCA(pv,qv){
  const F=[]; const pid=byVal(pv),qid=byVal(qv);
  const snap=(cur,line,msg,foundId)=>{const node={};node[pid]='target';node[qid]='target';if(foundId!=null)node[foundId]='found';if(cur>=0&&!node[cur])node[cur]='current';F.push({node,msg,line});};
  function rec(id){
    if(id<0) return -1;
    snap(id,1,`At <b>${TREE[id].val}</b>: is it ${pv} or ${qv}? Else search both subtrees.`);
    if(id===pid||id===qid){snap(id,2,`Hit a target (<b>${TREE[id].val}</b>) → return it upward.`);return id;}
    const l=rec(TREE[id].l), r=rec(TREE[id].r);
    if(l>=0&&r>=0){snap(id,5,`<span class="ok">${pv} came from one side, ${qv} from the other → LCA is ${TREE[id].val}!</span>`,id);return id;}
    const up=l>=0?l:r;
    snap(id,6,`${up>=0?'One target ('+TREE[up].val+') found below':'Neither target here'} → propagate up.`);
    return up;
  }
  const lcaId=rec(0);
  snap(lcaId,5,`<span class="ok">LCA of ${pv} and ${qv} = ${TREE[lcaId].val}.</span>`,lcaId);
  return F;
}

function genValidBST(){
  const F=[],done=new Set(); let ok=true;
  const snap=(cur,line,msg,bounds,bad)=>{const node={};done.forEach(id=>node[id]='done');if(cur>=0)node[cur]=bad?'bad':'current';F.push({node,bounds,msg,line});};
  function rec(id,lo,hi){
    if(id<0) return true;
    const v=TREE[id].val, lt=lo===-Infinity?'−∞':lo, ht=hi===Infinity?'+∞':hi;
    snap(id,1,`At <b>${v}</b>: must be strictly inside (${lt}, ${ht}).`,`(${lt}, ${ht})`);
    if(v<=lo||v>=hi){ok=false;snap(id,2,`<span class="bad">${v} violates (${lt}, ${ht}) → NOT a BST.</span>`,`(${lt}, ${ht})`,true);return false;}
    done.add(id);
    snap(id,4,`${v} is valid → left must be &lt; ${v}, right must be &gt; ${v}.`,`(${lt}, ${ht})`);
    return rec(TREE[id].l,lo,v) && rec(TREE[id].r,v,hi);
  }
  rec(0,-Infinity,Infinity);
  snap(-1,-1, ok?`<span class="ok">Valid BST</span> — every node respected its (low, high) window.`:`<span class="bad">Not a BST.</span>`);
  return F;
}

    const codePart=ci>=0?line.slice(0,ci):line, comPart=ci>=0?line.slice(ci):'';
    let h=esc(codePart)
      .replace(/\b(class|public|private|struct|int|long|void|bool|auto|vector|queue|stack|priority_queue|pair|return|while|for|if|else|true|false|const|new|delete|nullptr|NULL|max|min|abs|reverse|swap|push|pop|top|front|empty|size|push_back|pop_back|begin|end)\b/g,'<span class="kw">$1</span>')
      .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
    let cls='cl';
    if(comPart){ cls+=' has-cm'; h+='<span class="cm">'+esc(comPart).replace(/(★[^<]*)/g,'<span class="star">$1</span>')+'</span>'; }
    return `<span class="${cls}"><span class="cmdot">●</span>${h===''?'&nbsp;':h}</span>`;
  }).join('');
}

/* ════════════════ TREE SCENE ════════════════ */
function svgTree(f){
  let s=`<svg viewBox="0 0 522 312" preserveAspectRatio="xMidYMid meet">`;
  TREE.forEach((nd,id)=>{ [nd.l,nd.r].forEach(c=>{ if(c>=0){ const [x1,y1]=POS[id],[x2,y2]=POS[c];
    const st=f.node&&f.node[c]; const on=(st==='done'||st==='path'||st==='found'||st==='target');
    s+=`<line class="tedge${on?' on':''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`; }}); });
  TREE.forEach((nd,id)=>{ const [x,y]=POS[id]; const st=(f.node&&f.node[id])||'';
    let stroke='#3a4658',fill='#10161e',sw=2.2;
    if(st==='done'){stroke='#69ff47';fill='#0c2417';}
    if(st==='stack'){stroke='#00e5ff';fill='#06222b';}
    if(st==='path'){stroke='#bf5af2';fill='#1a1026';}
    if(st==='target'){stroke='#ff9f0a';fill='#241803';sw=3;}
    if(st==='found'){stroke='#69ff47';fill='#123a1f';sw=3.6;}
    if(st==='bad'){stroke='#ff6b6b';fill='#2a0e0e';sw=3.6;}
    if(st==='current'){stroke='#ffd60a';fill='#241d04';sw=3.8;}
    const halo = st==='current'?`<circle cx="${x}" cy="${y}" r="25" fill="none" stroke="#ffd60a" stroke-width="1.3" opacity=".5"/>`:'';
    const badge = f.heights&&f.heights[id]!=null?`<text class="tbadge" x="${x}" y="${y+29}">h=${f.heights[id]}</text>`:'';
    s+=`${halo}<circle cx="${x}" cy="${y}" r="18" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text class="tnval" x="${x}" y="${y}">${nd.val}</text>${badge}`;
  });
  return s+'</svg>';
}
function qpills(label,arr){
  let h=`<div class="qrow"><span class="qlabel">${label}</span>`;
  if(!arr.length) h+=`<span class="qp empty">empty</span>`; else arr.forEach(t=>h+=`<span class="qp">${t}</span>`);
  return h+`</div>`;
}
function treeSide(f){
  let tables='',heap='';
  if(f.result) heap+=qpills('RESULT →',f.result);
  if(f.pathVals) heap+=qpills('PATH ↓',f.pathVals);
  if(f.remaining!=null) heap+=`<div class="cost" style="color:#ffd479">remaining target = ${f.remaining}</div>`;
  if(f.bounds) heap+=`<div class="cost" style="color:#bf8aff">valid window ${f.bounds}</div>`;
  if(f.best!=null) heap+=`<div class="cost">best diameter = ${f.best}</div>`;
  if(f.fifo) heap+=qpills('QUEUE →',f.fifo);
  if(f.stack) tables+=`<div class="vtbl"><div class="cap">CALL STACK ↑ (top = current)</div><div class="qrow" style="min-height:0">${f.stack.length?f.stack.slice().reverse().map(v=>`<span class="qp" style="background:#06343f;border-color:#0e6b80;color:#bdf0ff">${v}</span>`).join(''):'<span class="qp empty">empty</span>'}</div></div>`;
  if(f.levels) tables+=`<div class="vtbl"><div class="cap">levels so far</div>${f.levels.length?f.levels.map((l,i)=>`<div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#bdf0ff;padding:1px 0">L${i}: [${l.join(', ')}]</div>`).join(''):'<span class="qp empty">—</span>'}</div>`;
  return {tables,heap};
}

/* ════════════════ VARIATIONS PANEL ════════════════ */
function varPanel(p){
  const vs=VARS[p.label]||[];
  if(!vs.length) return '';
  return `<div class="varhead">🔀 VARIATION TEMPLATES — same skeleton, small twists</div>`+
    vs.map((v,i)=>`<div class="cb varcb">
      <div class="cbbar"><span class="vtag">VARIATION ${i+1}</span><span class="cbtitle">${v.name}</span><button class="cbtoggle varcopy" data-vi="${i}">copy</button></div>
      <div class="varwhen">${v.when}</div>
      <pre>${hl(v.code)}</pre>
    </div>`).join('');
}

/* ════════════════ RENDER ════════════════ */
const side=document.getElementById('side'), main=document.getElementById('main');
let active=0, stepTimer=null;
document.getElementById('menuToggle').onclick=()=>side.classList.toggle('open');

function buildSidebar(){
  const groups=[]; let cur=null;
  P.forEach((p,i)=>{ if(!cur||cur.cat!==p.cat){cur={cat:p.cat,items:[]};groups.push(cur);} cur.items.push({p,i}); });
  let html='';
  groups.forEach(g=>{ const c=CAT[g.cat].c;
    html+=`<div class="catlabel" style="color:${c}">${CAT[g.cat].label}<span class="catn">${g.items.length}</span></div>`+
    g.items.map(({p,i})=>`<div class="navitem ${i===active?'on':''}" data-i="${i}" style="${i===active?'border-left-color:'+c:''}">
        <div class="tag" style="color:${c}">${CAT[p.cat].label}</div><div class="nm">${p.label}</div></div>`).join('');
  });
  side.innerHTML=html;
  side.querySelectorAll('.navitem').forEach(el=>el.onclick=()=>{active=+el.dataset.i;render();if(window.innerWidth<=860)side.classList.remove('open');});
}

function render(){
  if(stepTimer){clearInterval(stepTimer);stepTimer=null;}
  const p=P[active], col=CAT[p.cat].c;
  const notes=`<div class="cards">
      <div class="ic"><div class="h">WHEN TO USE</div><p>${p.when}</p></div>
      <div class="ic" style="border-color:${col}33"><div class="h" style="color:${col}">★ KEY INSIGHT</div><p>${p.insight}</p></div>
      <div class="ic analogy"><div class="h" style="color:${col}">◈ ANALOGY / MENTAL MODEL</div><p>${p.analogy}</p></div>
      <div class="ic bugs"><div class="h">⚠ BUGS YOU ACTUALLY HIT</div><ul>${p.bugs.map(b=>`<li>${b}</li>`).join('')}</ul></div>
    </div>
    <div class="probs"><div class="h">EXAMPLE PROBLEMS</div>${p.problems.map(n=>`<span class="chip">${n}</span>`).join('')}</div>`;

  const codeHtml=`<div class="cb">
      <div class="cbbar"><span class="dots"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i></span>
        <span class="cbtitle">${p.label.toLowerCase().replace(/[^a-z]+/g,'_').replace(/^_|_$/g,'')}.cpp</span>
        <button class="cbtoggle" id="revealAll">💬 reveal all</button></div>
      <pre>${hl(p.code)}</pre>
      <div class="cbnote">● = this line hides a note — click to reveal, click again to hide.</div>
    </div>`;

  main.innerHTML=`<div class="fade">
    <div class="phead">
      <div>
        <span class="ptag" style="background:${col}22;border:1px solid ${col}55;color:${col}">${CAT[p.cat].label}</span>
        <span class="pcount">Pattern ${active+1} / ${P.length}</span>
        <h2>${p.label}</h2>
        <div class="srcline">${p.src}</div>
      </div>
      <div class="pheadbtns">
        <button class="copy" id="notesBtn">📝 show notes</button>
        <button class="copy" id="varBtn">🔀 variations</button>
        <button class="copy" id="codeBtn">⌨ hide code</button>
        <button class="copy" id="copyBtn">copy code</button>
      </div>
    </div>
    <div class="notesWrap" id="notesWrap" style="display:none">${notes}</div>
    <div class="varWrap" id="varWrap" style="display:none">${varPanel(p)}</div>
    <div class="split" id="split">
      <div class="demo">
        <div class="h">◈ STEP-BY-STEP — ${p.label.toUpperCase()}</div>
        <div class="stage" id="stage"></div>
        <div class="vmsg" id="vmsg"></div>
        <div class="vtables" id="vtables"></div>
        <div class="vctrl">
          <button class="play" id="play">▶ play</button>
          <button id="stepBtn">step ›</button>
          <button id="resetBtn">⟲ reset</button>
          <span class="vpos" id="vpos"></span>
          <span class="spd">speed <input type="range" id="spd" min="280" max="1700" value="950"><b id="spdlbl"></b></span>
        </div>
        <div class="trace"><div class="th">CODE BEING TRACED — <b>active line highlights live</b></div><pre id="trace"></pre></div>
      </div>
      <div class="codeCol">${codeHtml}</div>
    </div>
    <div class="pnav">
      <button id="prevBtn" ${active===0?'disabled':''}>← prev</button>
      <span class="pos">${active+1} of ${P.length}</span>
      <button id="nextBtn" ${active===P.length-1?'disabled':''}>next →</button>
    </div></div>`;
  main.scrollTop=0;

  const nb=main.querySelector('#notesBtn'), nw=main.querySelector('#notesWrap');
  nb.onclick=()=>{const show=nw.style.display==='none';nw.style.display=show?'':'none';nb.textContent=show?'📝 hide notes':'📝 show notes';nb.classList.toggle('done',show);};
  const vb=main.querySelector('#varBtn'), vw=main.querySelector('#varWrap');
  vb.onclick=()=>{const show=vw.style.display==='none';vw.style.display=show?'':'none';vb.textContent=show?'🔀 hide variations':'🔀 variations';vb.classList.toggle('done',show);};
  main.querySelectorAll('.varcopy').forEach(b=>b.onclick=()=>{const v=(VARS[p.label]||[])[+b.dataset.vi];navigator.clipboard.writeText(v.code);b.textContent='✓';setTimeout(()=>b.textContent='copy',1200);});
  const cbtn=main.querySelector('#codeBtn'), split=main.querySelector('#split');
  cbtn.onclick=()=>{const hid=!split.classList.contains('nocode');split.classList.toggle('nocode',hid);cbtn.textContent=hid?'⌨ show code':'⌨ hide code';cbtn.classList.toggle('done',hid);};
  main.querySelector('#copyBtn').onclick=e=>{navigator.clipboard.writeText(p.code);e.target.textContent='✓ copied';e.target.classList.add('done');setTimeout(()=>{e.target.textContent='copy code';e.target.classList.remove('done');},1500);};
  main.querySelector('#prevBtn').onclick=()=>{if(active>0){active--;render();}};
  main.querySelector('#nextBtn').onclick=()=>{if(active<P.length-1){active++;render();}};
  main.querySelectorAll('.cl.has-cm').forEach(el=>el.onclick=()=>el.classList.toggle('reveal'));
  const ra=main.querySelector('#revealAll');
  ra.onclick=()=>{const ls=[...main.querySelector('.cb').querySelectorAll('.cl.has-cm')];const on=ls.some(l=>l.classList.contains('reveal'));ls.forEach(l=>l.classList.toggle('reveal',!on));ra.classList.toggle('on',!on);ra.textContent=on?'💬 reveal all':'🙈 hide all';};

  mountStepper(p);
  buildSidebar();
}

function mountStepper(p){
  const frames=p.gen();
  const stage=main.querySelector('#stage'), vmsg=main.querySelector('#vmsg'),
        vtables=main.querySelector('#vtables'), vpos=main.querySelector('#vpos'),
        traceEl=main.querySelector('#trace'), playBtn=main.querySelector('#play'),
        spd=main.querySelector('#spd'), spdlbl=main.querySelector('#spdlbl');
  const tEls=[]; p.trace.forEach(ln=>{const x=document.createElement('span');x.className='tln';x.innerHTML=hl(ln)||'&nbsp;';traceEl.appendChild(x);tEls.push(x);});
  let idx=0;
  function draw(){
    const f=frames[idx];
    stage.innerHTML=svgTree(f);
    vmsg.classList.remove('flash');void vmsg.offsetWidth;vmsg.classList.add('flash');
    vmsg.innerHTML=`<span class="stepchip">STEP ${idx+1}</span>${f.msg}`;
    const sp=treeSide(f);
    vtables.innerHTML=(sp.heap?`<div style="flex:1;min-width:100%">${sp.heap}</div>`:'')+sp.tables;
    tEls.forEach((e,i)=>e.classList.toggle('hot',i===f.line));
    vpos.textContent=`${idx+1} / ${frames.length}`;
  }
  function stop(){if(stepTimer){clearInterval(stepTimer);stepTimer=null;}playBtn.textContent='▶ play';}
  function play(){ if(stepTimer){stop();return;} if(idx>=frames.length-1)idx=0; playBtn.textContent='❚❚ pause';
    stepTimer=setInterval(()=>{ if(idx>=frames.length-1){stop();return;} idx++;draw(); }, +spd.value); }
  const setspd=()=>{spdlbl.textContent=(spd.value/1000).toFixed(2)+'s'; if(stepTimer){clearInterval(stepTimer);stepTimer=setInterval(()=>{if(idx>=frames.length-1){stop();return;}idx++;draw();},+spd.value);}};
  spd.oninput=setspd; setspd();
  playBtn.onclick=play;
  main.querySelector('#stepBtn').onclick=()=>{stop();if(idx<frames.length-1){idx++;draw();}};
  main.querySelector('#resetBtn').onclick=()=>{stop();idx=0;draw();};
  draw();
}

render();
</script>
</body>
