<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph & Grid BFS — Pattern Revision Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* --- v2 polish: Inter features + a11y (auto-applied) --- */
  body{font-feature-settings:"cv02","cv03","cv04","ss01";letter-spacing:-.01em;-webkit-font-smoothing:antialiased;}
  :focus-visible{outline:2px solid var(--sp,#00e5ff);outline-offset:2px;border-radius:5px;}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}}
  :root{
    --bg:#0d0f14; --bg2:#0a0c11; --panel:#141920; --border:#1e2a38;
    --text:#c9d1d9; --txt2:#8b949e; --muted:#586069; --faint:#444d56;
    --head:#e6edf3;
    --grid:#69ff47; --multi:#00e5ff; --level:#ffd60a; --boundary:#ff9f0a; --graph:#bf5af2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,sans-serif;
    background:var(--bg); color:var(--text); min-height:100vh;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  code,kbd,samp{font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,monospace;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#26303d;border-radius:5px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .top{background:linear-gradient(135deg,#0d0f14,#141920);border-bottom:1px solid var(--border);padding:18px 26px 14px;}
  .top .row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .badge{background:#00e5ff22;border:1px solid #00e5ff55;color:var(--multi);font-size:10px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:3px;}
  .backbtn{text-decoration:none;color:var(--txt2);border:1px solid var(--border);background:rgba(255,255,255,.02);font-size:12px;font-weight:600;padding:5px 12px;border-radius:7px;transition:.15s;white-space:nowrap;}
  .backbtn:hover{border-color:#475569;color:var(--head);background:rgba(255,255,255,.05);}
  h1{margin:0;font-size:19px;font-weight:700;color:var(--head);letter-spacing:-.3px;}
  .top .meta{color:var(--faint);font-size:12px;}
  .top p{margin:6px 0 0;font-size:11px;color:var(--muted);letter-spacing:.3px;}

  .shell{display:flex;min-height:calc(100vh - 84px);}

  .side{width:248px;min-width:248px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;padding:10px 0 30px;}
  .catlabel{font-size:9px;letter-spacing:1.6px;color:var(--faint);padding:11px 16px 8px;font-weight:700;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;transition:color .15s;}
  .catlabel:hover{filter:brightness(1.3);}
  .catlabel .caret{font-size:8px;transition:transform .2s;display:inline-block;}
  .catgroup.open .catlabel .caret{transform:rotate(90deg);}
  .catlabel .catn{margin-left:auto;font-size:9px;color:var(--faint);background:#0e151d;border:1px solid var(--border);border-radius:10px;padding:1px 7px;}
  .catitems{overflow:hidden;max-height:0;transition:max-height .26s ease;}
  .catgroup.open .catitems{max-height:1500px;}
  .navitem{padding:9px 16px;cursor:pointer;border-left:3px solid transparent;transition:background .15s,border-color .15s;}
  .navitem:hover{background:#10151c;}
  .navitem.on{background:var(--panel);}
  .navitem .tag{font-size:8.5px;font-weight:700;letter-spacing:1.3px;opacity:.65;}
  .navitem.on .tag{opacity:1;}
  .navitem .nm{font-size:12px;color:var(--txt2);margin-top:2px;line-height:1.3;}
  .navitem.on .nm{color:var(--head);font-weight:600;}

  .main{flex:1;overflow-y:auto;padding:24px 30px 60px;max-width:980px;}
  .fade{animation:fade .35s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .phead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;}
  .ptag{font-size:9px;font-weight:700;letter-spacing:2px;padding:3px 10px;border-radius:3px;}
  .pcount{color:var(--faint);font-size:11px;margin-left:8px;}
  .phead h2{margin:8px 0 0;font-size:23px;font-weight:700;color:var(--head);letter-spacing:-.5px;}
  .copy{background:var(--panel);border:1px solid #30363d;color:var(--txt2);padding:8px 15px;border-radius:6px;cursor:pointer;font-size:11px;font-family:inherit;letter-spacing:.5px;white-space:nowrap;transition:.2s;}
  .copy:hover{border-color:#475569;color:var(--head);}
  .copy.done{background:#1a3a1a;border-color:#69ff47;color:#69ff47;}

  .pheadbtns{display:flex;gap:8px;flex-wrap:wrap;}
  /* side-by-side animation + code, collapsible notes */
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start;margin-bottom:14px;}
  .split .demo{margin-bottom:0;}
  .codeCol{display:flex;flex-direction:column;gap:14px;min-width:0;}
  .codeCol .cb{margin-bottom:0;}
  .notesWrap{margin-bottom:16px;animation:fade .3s ease;}
  @media(max-width:1080px){ .split{grid-template-columns:1fr;} }

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px;}
  .ic{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:16px 18px;transition:border-color .2s,transform .2s,box-shadow .2s;}
  .ic:hover{border-color:#2c3a4c;}
  .ic .h{font-size:9.5px;letter-spacing:1.6px;margin-bottom:8px;color:var(--muted);font-weight:700;font-family:'JetBrains Mono',monospace;}
  .ic p{margin:0;font-size:13.5px;line-height:1.72;color:var(--text);}
  .ic.analogy{grid-column:1/3;}
  .ic.analogy .h{color:var(--multi);}
  .ic.bugs{grid-column:1/3;border-color:#ff6b6b33;}
  .ic.bugs .h{color:#ff6b6b;}
  .ic.bugs ul{margin:0;padding-left:18px;}
  .ic.bugs li{font-size:13px;line-height:1.8;color:var(--text);margin-bottom:3px;}
  .ic.bugs code{background:#1c2530;color:#ffd479;padding:0 4px;border-radius:3px;font-size:11px;}
  .ic b{color:var(--head);}
  .ic .keyword{color:var(--multi);}

  .probs{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 15px;margin-bottom:14px;}
  .probs .h{font-size:9px;letter-spacing:1.5px;color:var(--muted);margin-bottom:8px;font-weight:700;}
  .chip{display:inline-block;background:var(--panel);border:1px solid #30363d;color:var(--txt2);font-size:11px;padding:4px 10px;border-radius:4px;margin:0 6px 6px 0;}
  .chip .done{color:#69ff47;}

  .cb{background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:14px;}
  .cbbar{background:var(--panel);border-bottom:1px solid var(--border);padding:9px 14px;display:flex;align-items:center;gap:8px;}
  .dots{display:flex;gap:6px;}
  .dots i{width:10px;height:10px;border-radius:50%;display:inline-block;}
  .cbtitle{font-size:11px;color:var(--muted);margin-left:6px;}
  .method{font-size:8.5px;font-weight:700;letter-spacing:1px;padding:2px 8px;border-radius:3px;margin-left:4px;}
  pre{margin:0;padding:18px 14px;font-size:12.5px;line-height:1.85;overflow-x:auto;white-space:pre;font-family:'JetBrains Mono','Fira Code',ui-monospace,Menlo,monospace;}
  .kw{color:#ff7b72;} .nm{color:#79c0ff;} .cm{color:#586069;font-style:italic;} .star{color:#ffd60a;font-weight:700;} .str{color:#a5d6ff;}
  /* click-to-reveal comments: hidden until you click the line */
  .cl{display:block;padding:0 8px;border-radius:5px;border-left:2px solid transparent;transition:background .14s,border-color .14s;}
  .cmdot{display:inline-block;width:9px;margin-right:8px;font-size:7px;color:#2c3540;vertical-align:middle;transition:color .14s,transform .14s;}
  .cl:not(.has-cm) .cmdot{visibility:hidden;}
  .cl.has-cm{cursor:pointer;}
  .cl.has-cm:hover{background:#0f1c25;border-left-color:#2a4452;}
  .cl.has-cm:hover .cmdot{color:var(--level);}
  .cl .cm{display:none;}
  .cl.reveal .cm{display:inline;animation:cmin .2s ease;}
  .cl.reveal .cmdot{color:#69ff47;transform:scale(1.25);}
  .cl.reveal{background:#0c1a14;border-left-color:#1f7a3a;}
  @keyframes cmin{from{opacity:0;}to{opacity:1;}}
  .cbtoggle{margin-left:auto;background:transparent;border:1px solid #30363d;color:var(--txt2);font-family:inherit;font-size:10px;letter-spacing:.5px;padding:4px 10px;border-radius:5px;cursor:pointer;transition:.15s;}
  .cbtoggle:hover{border-color:#475569;color:var(--head);}
  .cbtoggle.on{background:#0c1a14;border-color:#1f7a3a;color:#69ff47;}
  .cbnote{font-size:10px;color:var(--faint);padding:6px 16px 0;letter-spacing:.3px;}

  /* ── multi-mode pattern animation (Play / Frames / Demo) ── */
  .vh{font-size:9px;letter-spacing:1.5px;color:var(--multi);margin-bottom:12px;font-weight:700;font-family:'JetBrains Mono',monospace;}
  .vh span{color:var(--txt2);font-weight:400;letter-spacing:.5px;}
  .vmode{display:flex;gap:8px;margin-bottom:13px;flex-wrap:wrap;}
  .vmode button{background:var(--panel);border:1px solid #30363d;color:var(--txt2);padding:6px 13px;border-radius:7px;cursor:pointer;font-family:inherit;font-size:11.5px;font-weight:600;transition:.15s;}
  .vmode button:hover{border-color:#475569;color:var(--head);}
  .vmode button.on{background:#0c1a14;border-color:#1f7a3a;color:#69ff47;}
  .vstage{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px;min-height:300px;display:flex;align-items:center;justify-content:center;overflow:auto;}
  .vstage svg{width:100%;height:auto;max-width:520px;}
  .vstage svg text{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .vmsg{margin-top:11px;font-size:13.5px;line-height:1.65;color:var(--text);background:var(--panel);border:1px solid var(--border);border-left:3px solid var(--multi);border-radius:7px;padding:11px 14px;min-height:22px;}
  .vmsg b{color:var(--head);} .vmsg .ok{color:#69ff47;} .vmsg .bad{color:#ff6b6b;}
  .vmsg.flash{animation:stepin .35s ease;}
  @keyframes stepin{from{opacity:.25;transform:translateY(3px);}to{opacity:1;transform:none;}}
  .stepchip{display:inline-block;margin-right:9px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.2px;font-weight:700;color:var(--multi);background:#0a1f2a;border:1px solid #14424f;border-radius:20px;padding:2px 9px;vertical-align:1px;}
  .vctrl{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap;}
  .vctrl button{background:var(--panel);border:1px solid #30363d;color:var(--text);padding:6px 13px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit;font-weight:600;transition:.15s;}
  .vctrl button:hover{background:#1c2530;} .vctrl button:disabled{opacity:.4;cursor:not-allowed;}
  .vctrl button.play{background:var(--multi);border-color:var(--multi);color:#06223f;}
  .vpos{font-size:11px;color:var(--faint);margin-left:auto;font-family:'JetBrains Mono',monospace;}
  .vtables{margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;justify-content:center;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px 14px;}
  .vtbl{font-family:'JetBrains Mono',monospace;font-size:11px;}
  .vtbl .cap{color:var(--muted);margin-bottom:6px;letter-spacing:1px;font-weight:700;}
  .vtbl table{border-collapse:collapse;}
  .vtbl td{border:1px solid var(--border);min-width:25px;height:25px;text-align:center;color:var(--text);padding:0 4px;}
  .vtbl td.k{color:var(--faint);border:none;font-weight:700;}
  .vtbl td.g{color:#f0a500;} .vtbl td.b{color:#69ff47;} .vtbl td.on{background:#10202a;}
  .vstack{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .vstack .b{background:#0a2a33;border:1px solid #00e5ff;color:#9fe8ff;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;font-family:'JetBrains Mono',monospace;}
  .vstack .e{color:var(--faint);font-style:italic;font-size:11px;}
  /* ── manim-style scene ── */
  .vstage svg.scene{max-width:100%;width:100%;}
  .scene .ptr{transition:transform .5s cubic-bezier(.3,.9,.35,1),opacity .3s;}
  .scene .ptr path{fill:#ffd60a;animation:bob .9s ease-in-out infinite;}
  .scene .ptr text{fill:#ffd60a;font-size:8.5px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-family:'Inter',sans-serif;}
  @keyframes bob{50%{transform:translateY(-4px);}}
  .split.nocode{grid-template-columns:1fr;}
  .split.nocode .codeCol{display:none;}
  .spd{display:inline-flex;align-items:center;gap:7px;margin-left:6px;}
  .spd input{width:120px;accent-color:var(--multi);cursor:pointer;}
  .spd b{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;min-width:42px;}
  .demo:fullscreen{background:#07090d;overflow:auto;padding:30px 40px;border:none;border-radius:0;}
  .demo:fullscreen .vstage{min-height:62vh;}
  .scene text{font-family:'JetBrains Mono',monospace;font-weight:700;}
  .scene .slbl{font-family:'Inter',sans-serif;font-weight:600;font-size:11.5px;letter-spacing:2.2px;text-transform:uppercase;fill:#8b98a8;}
  .scene .nd .ring{fill:#131a22;stroke:#7e5151;stroke-width:2;transition:stroke .4s,fill .4s,stroke-width .3s;}
  .scene .nd text{fill:#e6edf3;}
  .scene .nd.front .ring{stroke:#00e5ff;fill:#0a2733;}
  .scene .nd.done .ring{stroke:#69ff47;fill:#0c2417;}
  .scene .nd.cur .ring{stroke:#ffd60a;fill:#241d04;stroke-width:3.5;}
  .scene .halo{fill:none;stroke:#ffd60a;stroke-width:2;opacity:0;transition:opacity .3s;}
  .scene .nd.cur .halo{opacity:.85;animation:halo 1.15s ease-in-out infinite;}
  @keyframes halo{50%{opacity:.15;}}
  .scene .qbx{fill:#0b1118;stroke:#27313d;stroke-width:1.6;transition:stroke .35s,fill .35s;}
  .scene .qbx.full{stroke:#00e5ff;fill:#081d26;}
  .scene .qbx.head{stroke:#fff;stroke-width:2;}
  .scene .qtx{fill:#9fe8ff;font-size:15px;}
  .scene .vbx{fill:#0b1118;stroke:#27313d;stroke-width:1.6;transition:stroke .35s,fill .35s;}
  .scene .vbx.full{stroke:#1f7a3a;fill:#0c2417;}
  .scene .vtx{fill:#69ff47;font-size:14px;}
  .scene .curB{fill:#0b1118;stroke:#3a4452;stroke-width:1.8;transition:stroke .35s,fill .35s;}
  .scene .curB.live{stroke:#ffd60a;fill:#171304;}
  .scene .curT{fill:#ffd60a;font-size:22px;}
  .lcchip{margin-left:10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1px;font-weight:700;color:#ffb86b;background:#241604;border:1px solid #5a3a14;border-radius:20px;padding:2px 10px;vertical-align:1px;}
  .vcode{margin:0 0 12px;background:#070a0e;border:1px solid var(--border);border-radius:10px;padding:10px 8px;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:11.5px;line-height:1.75;overflow-x:auto;}
  .rl{display:block;padding:1px 12px;border-left:3px solid transparent;white-space:pre;color:#7d8895;transition:background .2s,color .2s,border-color .2s;}
  .rl.active{background:#0a2733;border-left-color:#00e5ff;color:#dff6ff;font-weight:700;}

  .demo{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:14px;}
  .demo .h{font-size:9px;letter-spacing:1.5px;color:var(--multi);margin-bottom:12px;font-weight:700;}
  .demowrap{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
  .gd{display:flex;flex-direction:column;gap:3px;}
  .gdrow{display:flex;gap:3px;}
    .ghere{position:absolute;top:-17px;left:50%;transform:translateX(-50%);color:#ffd60a;font-size:13px;animation:bob .9s ease-in-out infinite;pointer-events:none;}
  .gc{position:relative;width:42px;height:42px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:#1a212b;color:#3a4452;border:1.5px solid transparent;transition:background .35s,color .35s,border-color .35s,transform .25s;}
  .demoside{flex:1;min-width:190px;}
  .demoinfo{font-size:12px;line-height:1.6;color:var(--text);min-height:46px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:10px;}
  .demoinfo b{color:var(--head);}
  .counter{font-size:13px;color:var(--multi);font-weight:700;margin-bottom:10px;}
  .dctrl{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
  .dctrl button{background:var(--panel);border:1px solid #30363d;color:var(--text);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;font-weight:600;transition:.15s;}
  .dctrl button:hover{background:#1c2530;}
  .dctrl button.play{background:var(--multi);border-color:var(--multi);color:#06223f;}

  /* code-traversal panel synced to animation */
  .trace{margin-top:14px;background:#070a0e;border:1px solid var(--border);border-radius:8px;overflow:hidden;}
  .trace .th{background:var(--panel);border-bottom:1px solid var(--border);padding:7px 13px;font-size:10px;letter-spacing:1px;color:var(--muted);font-weight:700;}
  .trace .th b{color:var(--multi);}
  .trace pre{padding:12px 8px;font-size:12px;line-height:1.7;}
  .tln{display:block;padding:1px 12px;border-left:3px solid transparent;white-space:pre;color:#7d8895;border-radius:0;transition:background .2s,color .2s,border-color .2s;}
  .tln.hot{background:#0f2a33;border-left-color:var(--multi);color:#dff6ff;}
  .tln.hot .nm{color:#9fe0ff;}

  .pnav{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);}
  .pnav button{background:transparent;border:1px solid #30363d;color:var(--txt2);padding:8px 18px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;transition:.15s;}
  .pnav button:hover:not(:disabled){border-color:#475569;color:var(--head);}
  .pnav button:disabled{color:#2a323d;cursor:not-allowed;}
  .pnav .pos{font-size:11px;color:var(--faint);}

  .hint{font-size:10.5px;color:var(--faint);margin-top:4px;}

  .menuToggle{display:none;}
  @media(max-width:860px){
    .shell{flex-direction:column;}
    .side{width:100%;min-width:0;border-right:none;border-bottom:1px solid var(--border);max-height:0;overflow:hidden;padding:0;transition:max-height .3s ease;}
    .side.open{max-height:1400px;padding:10px 0 20px;}
    .menuToggle{display:inline-block;}
    .cards{grid-template-columns:1fr;}
    .ic.analogy,.ic.bugs{grid-column:auto;}
    .main{padding:18px 16px 50px;}
    .gc{width:36px;height:36px;font-size:13px;}
  }

  /* ---- 3D + glass upgrade ---- */
  #bg3d{position:fixed;inset:0;width:100vw;height:100vh;z-index:-2;opacity:.5;pointer-events:none;}
  body{background:radial-gradient(1200px 820px at 72% -12%, #15243c 0%, #0d0f14 56%) fixed;}
  .top{backdrop-filter:blur(10px);background:rgba(12,16,22,.72)!important;}
  .side{backdrop-filter:blur(10px);background:rgba(9,11,16,.66)!important;}
  h1{background:linear-gradient(90deg,#00e5ff,#7c93ff 55%,#f78fb3);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .ic{background:rgba(10,12,17,.62)!important;backdrop-filter:blur(6px);}
  .cb,.trace{background:rgba(7,10,14,.78)!important;backdrop-filter:blur(6px);}
  .probs,.demo{background:rgba(10,12,17,.6)!important;backdrop-filter:blur(6px);}
  .ic,.cb,.probs,.demo,.trace{box-shadow:0 8px 30px rgba(0,0,0,.28);}
  .demowrap3d{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .g3dcol{flex:2;min-width:300px;}
  .g3dside{flex:1;min-width:200px;}
  .g3dcol canvas{width:100%;height:300px;display:block;border-radius:12px;border:1px solid var(--border);
    background:radial-gradient(420px 260px at 50% 35%, rgba(0,229,255,.07), rgba(10,12,17,.4));}
  .g3dhint{font-size:10.5px;color:var(--faint);margin-top:7px;}

  .qrow{display:flex;align-items:center;gap:9px;margin-top:11px;flex-wrap:wrap;min-height:26px;}
  .qlabel{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-weight:700;}

// A grid2 island is a SUB-island only if EVERY cell of it

void bfs(int sr, int sc, vector<vector<int>>& g1,
         vector<vector<int>>& g2, vector<vector<int>>& vis, bool& ok) {
    int m = g1.size(), n = g1[0].size();
    int dr[] = {-1,1,0,0}, dc[] = {0,0,-1,1};
    queue<pair<int,int>> q;
    q.push({sr, sc}); vis[sr][sc] = 1;

    while (!q.empty()) {
        auto [r, c] = q.front(); q.pop();
        if (g1[r][c] == 0) ok = false;       // ★ failed - but DON'T stop
        for (int i = 0; i < 4; i++) {
            int nr = r+dr[i], nc = c+dc[i];
            if (nr>=0 && nr<m && nc>=0 && nc<n
                && g2[nr][nc]==1 && !vis[nr][nc]) {  // ★ flood grid2
                vis[nr][nc] = 1;
                q.push({nr, nc});
            }
        }
    }
}

int countSubIslands(vector<vector<int>>& g1, vector<vector<int>>& g2) {
    int m = g1.size(), n = g1[0].size();
    vector<vector<int>> vis(m, vector<int>(n, 0));
    int cnt = 0;
    for (int i = 0; i < m; i++)
        for (int j = 0; j < n; j++)
            if (g2[i][j]==1 && !vis[i][j]) {
                bool ok = true;              // ★ assume sub-island...
                bfs(i, j, g1, g2, vis, ok);  // ...flood the WHOLE island
                if (ok) cnt++;               // ★ count only if clean
            }
    return cnt;
}`

  code:`int orangesRotting(vector<vector<int>>& g) {
    int m = g.size(), n = g[0].size(), fresh = 0;
    queue<pair<int,int>> q;
    for (int i = 0; i < m; i++)
        for (int j = 0; j < n; j++) {
            if (g[i][j] == 2) q.push({i, j});  // ★ all sources
            else if (g[i][j] == 1) fresh++;
        }
    if (fresh == 0) return 0;
    int dr[] = {-1,1,0,0}, dc[] = {0,0,-1,1}, minutes = 0;

    while (!q.empty()) {
        int sz = q.size();          // ★ freeze THIS minute's batch
        bool spread = false;
        while (sz--) {              // ★ exactly one ring / minute
            auto [r, c] = q.front(); q.pop();
            for (int d = 0; d < 4; d++) {
                int nr = r+dr[d], nc = c+dc[d];
                if (nr>=0 && nr<m && nc>=0 && nc<n && g[nr][nc]==1) {

                    q.push({nr, nc});
                }

    }
    return fresh == 0 ? minutes : -1;

    vector<vector<int>> vis(m, vector<int>(n, 0));
    queue<pair<int,int>> q;

    // ★ seed ONLY border O's
    for (int i = 0; i < m; i++) {
        if (b[i][0]   == 'O') { vis[i][0]=1;   q.push({i,0}); }
        if (b[i][n-1] == 'O') { vis[i][n-1]=1; q.push({i,n-1}); }
    }
    for (int j = 0; j < n; j++) {
        if (b[0][j]   == 'O') { vis[0][j]=1;   q.push({0,j}); }
        if (b[m-1][j] == 'O') { vis[m-1][j]=1; q.push({m-1,j}); }
    }

    while (!q.empty()) {                  // mark everything reachable = SAFE
        auto [r, c] = q.front(); q.pop();
        for (int i = 0; i < 4; i++) {     // ★ 4 dirs, move through 'O'
            int nr = r+dr[i], nc = c+dc[i];
            if (nr>=0 && nr<m && nc>=0 && nc<n
                && b[nr][nc]=='O' && !vis[nr][nc]) {
                vis[nr][nc] = 1; q.push({nr, nc});
            }
        }
    }
    for (int i = 0; i < m; i++)           // unmarked O = trapped → flip
        for (int j = 0; j < n; j++)
            if (b[i][j]=='O' && !vis[i][j]) b[i][j] = 'X';
}`

    deque<int> dq;                       // ★ deque, not queue
    dist[src] = 0; dq.push_front(src);

    unordered_set<string> dict(words.begin(), words.end());
    if (!dict.count(end)) return 0;
    unordered_set<string> front = {begin}, back = {end};
    int steps = 1;

    while (!front.empty() && !back.empty()) {
        if (front.size() > back.size()) swap(front, back); // ★ smaller first
        unordered_set<string> next;
        for (string w : front) {
            for (int i = 0; i < (int)w.size(); i++) {
                char old = w[i];
                for (char c = 'a'; c <= 'z'; c++) {
                    w[i] = c;
                    if (back.count(w)) return steps + 1;  // ★ frontiers met
                    if (dict.count(w)) { next.insert(w); dict.erase(w); }

                w[i] = old;
            }

    vector<int> indeg(V, 0);
    for (int u = 0; u < V; u++)
        for (int v : adj[u]) indeg[v]++;       // ★ count incoming edges

    queue<int> q;
    for (int i = 0; i < V; i++)
        if (indeg[i] == 0) q.push(i);          // ★ no-dependency nodes first

    vector<int> order;
    while (!q.empty()) {
        int node = q.front(); q.pop();
        order.push_back(node);
        for (int nb : adj[node])
            if (--indeg[nb] == 0) q.push(nb);  // ★ freed → ready
    }
    return (int)order.size() == V ? order : vector<int>{}; // ★ cycle check

/* ───────────────────────── SYNTAX HIGHLIGHT ───────────────────────── */
function hl(code){
  const esc = t => t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return code.split('\n').map(line=>{
    const ci = line.indexOf('//');
    const codePart = ci>=0 ? line.slice(0,ci) : line;
    const comPart  = ci>=0 ? line.slice(ci)  : '';
    let h = esc(codePart)
      .replace(/\b(class|public|private|struct|int|void|bool|auto|vector|queue|deque|stack|string|pair|return|while|for|if|else|true|false|const|char|max|min|reverse|push_back|pop_back|push|pop|top|front|size|begin|end)\b/g,'<span class="kw">$1</span>')
      .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
    let cls = 'cl';
    if(comPart){
      cls += ' has-cm';                 // ★ this line hides a comment
      h += '<span class="cm">'+esc(comPart).replace(/(★[^<]*)/g,'<span class="star">$1</span>')+'</span>';
    }
    return `<span class="${cls}"><span class="cmdot">●</span>${h===''?'&nbsp;':h}</span>`;
  }).join('');
}

/* ---------- traces ---------- */
const T_DIST=["for (i,j) if (g==0) q.push({i,j});  // seed all sources","while (!q.empty()) {","  auto [r,c]=q.front(); q.pop();","  for (d : dirs) if (g[nr][nc]==1 && !vis)","    g[nr][nc]=g[r][c]+1;   // neighbour = me + 1","    q.push({nr,nc});","}"];
const H_DIST={seed:[0],step:[2,3,4,5],done:[6]};
const T_ROT=["for (i,j) if (g==2) q.push({i,j});  // rotten = sources","while (!q.empty()) {","  int sz=q.size();          // one MINUTE","  while(sz--){ auto [r,c]=q.front();q.pop();","    for(d:4) if(g[nr][nc]==1){","      g[nr][nc]=2; q.push({nr,nc}); } }","  minutes++;   // AFTER the whole ring","}"];
const H_ROT={seed:[0],step:[3,4,5],done:[6]};
const T_ISL=["for (i,j)","  if (g[i][j]==1 && !vis) {","    cnt++;             // new island","    bfs flood the whole island;","  }"];
const H_ISL={scan:[0,1],new:[2,3],step:[3],done:[]};
const T_FLOOD=["q.push(start); vis=1;","while(!q.empty()){","  auto [r,c]=q.front();q.pop();","  for(d:4) if(valid && !vis){","    vis=1; q.push({nr,nc}); }","}"];
const H_FLOOD={scan:[0],new:[0],step:[2,3,4],done:[]};
const T_AREA=["if (g==1 && !vis) {","  area=0;                 // per island","  while(!q.empty()){ pop; area++;   // count on POP","    for(d:4) if(valid&&!vis) push; }","  maxArea=max(maxArea,area);","}"];
const H_AREA={scan:[0],new:[0,1],step:[2,3],done:[4]};
const T_BND=["// seed BORDER land only","for border cells: if(g==1) q.push;","while(!q.empty()){ pop;","  for(d:4) if(g==1 && !vis) mark SAFE, push; }","// leftover land = trapped","for(i,j) if(g==1 && !vis) trapped++;"];
const H_BND={seed:[0,1],step:[2,3],trap:[4,5],done:[]};
const T_SUB=["for grid2 island (g2==1 && !vis) {","  ok=true;","  flood it; if any g1==0 -> ok=false;  // keep going!","  if(ok) sub++;","}"];
const H_SUB={scan:[0],new:[0,1],step:[2],judge:[3],done:[]};
const T_GBFS=["q.push(src); vis[src]=1;","while(!q.empty()){","  node=q.front(); q.pop();","  for(nb : adj[node])","    if(!vis[nb]){ vis[nb]=1;","      dist[nb]=dist[node]+1; q.push(nb); }","}"];
const H_GBFS={seed:[0],pop:[2],push:[3,4,5],done:[6]};
const T_CYC=["q.push({src,-1}); vis[src]=1;     // {node, parent}","while(!q.empty()){","  auto [node,par]=q.front(); q.pop();   // POP","  for(nb : adj[node])","    if(!vis[nb]){ vis[nb]=1; q.push({nb,node}); }  // PUSH","    else if(nb != par) return true;     // CYCLE!","}"];
const H_CYC={seed:[0],pop:[2],push:[3,4],cycle:[5],done:[6]};
const WL={start:0,end:6,nodes:[{pos:[-3,0,0],label:'hit'},{pos:[-1.7,0,0.4],label:'hot'},{pos:[-0.4,1.1,0],label:'dot'},{pos:[-0.4,-1.1,0.5],label:'lot'},{pos:[0.9,1.1,-0.4],label:'dog'},{pos:[0.9,-1.1,0.3],label:'log'},{pos:[2.2,0,0],label:'cog'}],edges:[[0,1],[1,2],[1,3],[2,4],[2,3],[3,5],[4,6],[4,5],[5,6]]};
const T_WL=["q.push(begin); vis={begin};","while(!q.empty()){","  string w=q.front(); q.pop();   // POP","  if(w==end) return steps;","  for pos i, char c in a..z:","    nw = w with w[i]=c;","    if(dict.has(nw) && !vis){","      vis.add(nw); q.push(nw); }   // PUSH","}"];
const H_WL={seed:[0],pop:[2,3],push:[4,5,6,7],done:[8]};
const T_GCMP=["for(s=0;s<V;s++)","  if(!vis[s]){ cnt++;   // new component","    bfs(s); }","// never reset vis"];
const H_GCMP={seed:[0,1],step:[2],done:[3]};
const T_GBIP=["color[s]=0; q.push(s);","while(!q.empty()){ node=q.front();q.pop();","  for(nb:adj[node])","    if(color[nb]==-1) color[nb]=color[node]^1;","    else if(color[nb]==color[node]) return false; }"];
const H_GBIP={seed:[0],step:[2,3,4],done:[]};
const T_GTOPO=["compute indeg[]; push all indeg==0;","while(!q.empty()){ node=q.front();q.pop();","  order.push(node);","  for(nb:adj[node]) if(--indeg[nb]==0) q.push(nb); }","// order.size()!=V -> cycle"];
const H_GTOPO={seed:[0],step:[1,2,3],done:[4]};

/* ---------- which demo for each pattern ---------- */
function gcfg(mode,base,extra){return Object.assign({kind:'graph',mode},base,extra||{});}
function animFor(p){
  const L=p.label;
  if(L.indexOf('Flood Fill')===0) return {kind:'grid',mode:'flood',single:true,grid:FLOOD_G,trace:T_FLOOD,hot:H_FLOOD,title:'flood one region'};
  if(L.indexOf('Number of Islands')===0) return {kind:'grid',mode:'flood',grid:ISL_G,trace:T_ISL,hot:H_ISL,title:'count islands'};
  if(L.indexOf('Max Area')===0) return {kind:'grid',mode:'area',grid:ISL_G,trace:T_AREA,hot:H_AREA,title:'largest island'};
  if(L.indexOf('Two-Grid')===0) return {kind:'grid',mode:'twogrid',grid:SUB_G2,g1:SUB_G1,trace:T_SUB,hot:H_SUB,title:'sub-islands'};
  if(L.indexOf('8-Directional')>=0) return {kind:'grid',mode:'distance',dirs:8,grid:DIR8_G,label:'rings (king moves)',trace:T_DIST,hot:H_DIST,title:'8-dir spread'};
  if(p.cat==='MULTI') return {kind:'grid',mode:'distance',grid:DIST_G,label:'max distance',trace:T_DIST,hot:H_DIST,title:'distance waves'};
  if(p.cat==='LEVEL') return {kind:'grid',mode:'distance',srcVal:2,wallVal:0,grid:ROT_G,label:'minute',trace:T_ROT,hot:H_ROT,title:'rot, minute by minute'};
  if(p.cat==='BOUNDARY') return {kind:'grid',mode:'boundary',grid:BND_G,trace:T_BND,hot:H_BND,title:'escape from the border'};
  if(L.indexOf('Basic Graph')===0) return gcfg('bfs',G_GEN,{trace:T_GBFS,hot:H_GBFS,caption:'BFS layers spreading from the start node'});
  if(L.indexOf('Connected Components')===0) return gcfg('components',G_COMP,{trace:T_GCMP,hot:H_GCMP,caption:'each cluster = one connected component'});
  if(L.indexOf('Shortest Path')===0) return gcfg('bfs',G_GEN,{trace:T_GBFS,hot:H_GBFS,caption:'layer index = shortest #edges from start'});
  if(L.indexOf('0-1 BFS')===0) return gcfg('bfs',G_GEN,{trace:T_GBFS,hot:H_GBFS,caption:'0-weight edge -> deque front, 1 -> back'});
  if(L.indexOf('State-Space')===0) return gcfg('wordladder',WL,{trace:T_WL,hot:H_WL,caption:'words = nodes; change one letter to reach dictionary neighbours (hit → cog)'});
  if(L.indexOf('Bidirectional')===0) return gcfg('bidir',G_GEN,{start:0,end:4,trace:T_GBFS,hot:H_GBFS,caption:'two frontiers grow and meet in the middle'});
  if(L.indexOf('Cycle Detection')===0) return gcfg('cycle',G_GEN,{trace:T_CYC,hot:H_CYC,caption:'queue holds {node, parent}; a visited NON-parent neighbour = cycle'});
  if(L.indexOf('Bipartite')===0) return gcfg('bipartite',G_BIP,{trace:T_GBIP,hot:H_GBIP,caption:'2-colour; a same-colour edge breaks it'});
  if(L.indexOf('Topological')>=0) return gcfg('topo',G_DAG,{directed:true,trace:T_GTOPO,hot:H_GTOPO,caption:'peel indegree-0 nodes, layer by layer'});
  return null;
}

/* ====================== 2D GRID ENGINE ====================== */
function mountGrid(host, cfg, col){
  const g=cfg.grid, m=g.length, n=g[0].length;
  const g1=cfg.g1||null;
  const rdir=cfg.dirs===8?DR8:DR, cdir=cfg.dirs===8?DC8:DC;
  const srcVal=cfg.srcVal===undefined?0:cfg.srcVal;
  const wallVal=cfg.wallVal===undefined?null:cfg.wallVal;
  const inb=(r,c)=>r>=0&&r<m&&c>=0&&c<n;
  const frames=[];
  const mk=()=>g.map((row,i)=>row.map((v,j)=>{
    if(wallVal!==null && v===wallVal) return {cls:'wall'};
    if(g1 && g1[i][j]===1) return {cls:'idle',g1:1};
    return {cls:'idle'};
  }));
  const clone=s=>s.map(r=>r.map(c=>({...c})));

  if(cfg.mode==='distance'){
    const dist=g.map(r=>r.map(_=>-1)); const seeds=[];
    for(let i=0;i<m;i++)for(let j=0;j<n;j++)if(g[i][j]===srcVal){dist[i][j]=0;seeds.push([i,j]);}
    let q=seeds.slice(),h=0;
    while(h<q.length){const a=q[h++],r=a[0],c=a[1];for(let d=0;d<rdir.length;d++){const nr=r+rdir[d],nc=c+cdir[d];if(inb(nr,nc)&&dist[nr][nc]===-1&&g[nr][nc]!==srcVal&&(wallVal===null||g[nr][nc]!==wallVal)){dist[nr][nc]=dist[r][c]+1;q.push([nr,nc]);}}}
    let mx=0;for(let i=0;i<m;i++)for(let j=0;j<n;j++)if(dist[i][j]>mx)mx=dist[i][j];
    for(let lvl=0;lvl<=mx;lvl++){
      const st=mk();
      for(let i=0;i<m;i++)for(let j=0;j<n;j++) if(dist[i][j]>=0&&dist[i][j]<=lvl){const t=dist[i][j];st[i][j]={cls:t===0?'src':'fill',txt:String(t),tone:t};}
      frames.push({state:st,info: lvl===0?`Seed every source at distance <b>0</b> — they spread together.`:`Ring <b>${lvl}</b>: each new cell = neighbour + 1.`,count:`${cfg.label||'max distance'}: ${lvl}`,phase:lvl===0?'seed':'step'});
    }
    frames.push({state:frames[frames.length-1].state,info:`Done — each cell holds its shortest distance to the nearest source.`,count:`${cfg.label||'max distance'}: ${mx}`,phase:'done'});
  }
  else if(cfg.mode==='flood'||cfg.mode==='area'){
    const vis=g.map(r=>r.map(_=>0));let cnt=0,maxA=0;const st=mk();
    frames.push({state:clone(st),info:`Scan the grid; each unvisited land cell starts a fresh BFS.`,count:cfg.single?'':'islands: 0',phase:'scan'});
    for(let i=0;i<m;i++)for(let j=0;j<n;j++) if(g[i][j]===1&&!vis[i][j]){
      cnt++; const colr=ISLAND_COLORS[(cnt-1)%ISLAND_COLORS.length];
      let ring=[[i,j]];vis[i][j]=1;let area=0,first=true;
      while(ring.length){
        ring.forEach(a=>{st[a[0]][a[1]]={cls:'comp',color:colr};area++;});
        const ct=cfg.mode==='area'?`max area: ${Math.max(maxA,area)} (cur ${area})`:(cfg.single?'':`islands: ${cnt}`);
        frames.push({state:clone(st),info:first?`New land (${i},${j}) → ${cfg.mode==='area'?'measure its size':(cfg.single?'flood it':'cnt++ and flood')}.`:`Spreading…`,count:ct,phase:first?'new':'step'});
        first=false;const nx=[];
        ring.forEach(a=>{const r=a[0],c=a[1];for(let d=0;d<4;d++){const nr=r+DR[d],nc=c+DC[d];if(inb(nr,nc)&&g[nr][nc]===1&&!vis[nr][nc]){vis[nr][nc]=1;nx.push([nr,nc]);}}});
        ring=nx;
      }
      maxA=Math.max(maxA,area);
    }
    frames.push({state:clone(st),info: cfg.mode==='area'?`Done — largest island has <b>${maxA}</b> cells.`:(cfg.single?`Region flooded.`:`Done — <b>${cnt}</b> islands.`),count:cfg.mode==='area'?`max area: ${maxA}`:(cfg.single?'':`islands: ${cnt}`),phase:'done'});
  }
  else if(cfg.mode==='boundary'){
    const vis=g.map(r=>r.map(_=>0));const st=mk();const seeds=[];
    for(let i=0;i<m;i++)for(let j=0;j<n;j++) if((i===0||i===m-1||j===0||j===n-1)&&g[i][j]===1&&!vis[i][j]){vis[i][j]=1;seeds.push([i,j]);}
    seeds.forEach(a=>st[a[0]][a[1]]={cls:'safe'});
    frames.push({state:clone(st),info:`Seed every <b>border</b> land cell — these can reach the edge.`,count:`safe: ${seeds.length}`,phase:'seed'});
    let ring=seeds.slice(),safe=seeds.length;
    while(ring.length){
      const nx=[];
      ring.forEach(a=>{const r=a[0],c=a[1];for(let d=0;d<4;d++){const nr=r+DR[d],nc=c+DC[d];if(inb(nr,nc)&&g[nr][nc]===1&&!vis[nr][nc]){vis[nr][nc]=1;st[nr][nc]={cls:'safe'};nx.push([nr,nc]);safe++;}}});
      if(nx.length) frames.push({state:clone(st),info:`Flood inward through connected land — mark it SAFE.`,count:`safe: ${safe}`,phase:'step'});
      ring=nx;
    }
    let trapped=0;
    for(let i=0;i<m;i++)for(let j=0;j<n;j++) if(g[i][j]===1&&!vis[i][j]){st[i][j]={cls:'trapped'};trapped++;}
    frames.push({state:clone(st),info:`Unmarked land can't reach the border → <b>trapped</b> (enclaves / captured).`,count:`trapped: ${trapped}`,phase:'trap'});
  }
  else if(cfg.mode==='twogrid'){
    const g2=g;const vis=g2.map(r=>r.map(_=>0));const st=mk();let sub=0;
    frames.push({state:clone(st),info:`Faint-green cells = land in <b>grid1</b> (reference). We flood islands of <b>grid2</b>.`,count:`sub-islands: 0`,phase:'scan'});
    for(let i=0;i<m;i++)for(let j=0;j<n;j++) if(g2[i][j]===1&&!vis[i][j]){
      let ring=[[i,j]];vis[i][j]=1;let ok=true,cellsList=[],first=true;
      while(ring.length){
        ring.forEach(a=>{const r=a[0],c=a[1];st[r][c]={cls:'comp',color:'#00e5ff'};cellsList.push([r,c]);if(g1[r][c]===0)ok=false;});
        frames.push({state:clone(st),info:first?`New grid2 island (${i},${j}) — assume sub-island, flood it.`:`Spreading; checking each cell against grid1…`,count:`sub-islands: ${sub}`,phase:first?'new':'step'});
        first=false;const nx=[];
        ring.forEach(a=>{const r=a[0],c=a[1];for(let d=0;d<4;d++){const nr=r+DR[d],nc=c+DC[d];if(inb(nr,nc)&&g2[nr][nc]===1&&!vis[nr][nc]){vis[nr][nc]=1;nx.push([nr,nc]);}}});
        ring=nx;
      }
      if(ok)sub++;
      cellsList.forEach(a=>st[a[0]][a[1]]={cls:ok?'accept':'reject'});
      frames.push({state:clone(st),info: ok?`Every cell sits on grid1 land → <b>sub-island ✓</b>`:`A cell was water in grid1 → <b>rejected ✗</b>`,count:`sub-islands: ${sub}`,phase:'judge'});
    }
    frames.push({state:clone(st),info:`Done — <b>${sub}</b> sub-islands.`,count:`sub-islands: ${sub}`,phase:'done'});
  }

  const wrap=document.createElement('div');
  wrap.innerHTML=`<div class="h">◈ LIVE DRY-RUN — ${cfg.title||'BFS'} + the line running</div>
    <div class="demowrap">
      <div class="gd" id="gdGrid"></div>
      <div class="demoside">
        <div class="counter" id="gdCount"></div>
        <div class="demoinfo" id="gdInfo"></div>
        <div class="dctrl"><button class="play" id="gdPlay">▶ play</button><button id="gdStep">step ›</button><button id="gdReset">⟲ reset</button></div>
        <div class="hint">play, or step one ring at a time</div>
      </div>
    </div>
    <div class="trace"><div class="th">CODE BEING TRAVERSED — <b>active line highlights live</b></div><pre id="gdTrace"></pre></div>`;
  host.appendChild(wrap);
  const cells=[],gridEl=wrap.querySelector('#gdGrid');
  for(let r=0;r<m;r++){const row=document.createElement('div');row.className='gdrow';cells[r]=[];for(let c=0;c<n;c++){const el=document.createElement('div');el.className='gc';row.appendChild(el);cells[r][c]=el;}gridEl.appendChild(row);}
  const infoEl=wrap.querySelector('#gdInfo'),countEl=wrap.querySelector('#gdCount');
  const traceLines=cfg.trace||[],traceEl=wrap.querySelector('#gdTrace'),tEls=[];
  traceLines.forEach(ln=>{const x=document.createElement('span');x.className='tln';x.innerHTML=hl(ln)||'&nbsp;';traceEl.appendChild(x);tEls.push(x);});
  let idx=0,timer=null;
  function draw(){const f=frames[idx];
    for(let r=0;r<m;r++)for(let c=0;c<n;c++){const s=f.state[r][c],el=cells[r][c];el.textContent=s.txt||'';el.style.borderColor='transparent';el.style.transform='';
      if(s.cls==='wall'){el.style.background='#11161d';el.style.color='#2a323d';}
      else if(s.cls==='src'){el.style.background='#0e7d72';el.style.color='#eafffb';el.style.borderColor='#1aab9c';}
      else if(s.cls==='fill'){el.style.background=distColor(s.tone);el.style.color='#eaf6ff';el.style.transform='scale(1.04)';}
      else if(s.cls==='comp'){el.style.background=s.color+'cc';el.style.color='#06121a';el.style.borderColor=s.color;}
      else if(s.cls==='safe'){el.style.background='#1f8f5f';el.style.color='#eafff3';el.style.borderColor='#3ecf8e';}
      else if(s.cls==='trapped'){el.style.background='#3a1f27';el.style.color='#ff8aa0';el.style.borderColor='#ff6b6b';}
      else if(s.cls==='accept'){el.style.background='#1f8f5f';el.style.color='#eafff3';el.style.borderColor='#3ecf8e';}
      else if(s.cls==='reject'){el.style.background='#3a1f27';el.style.color='#ff8aa0';el.style.borderColor='#ff6b6b';}
      else {el.style.background=s.g1?'#16241c':'#1a212b';el.style.color='#3a4452';}
    }
    infoEl.innerHTML=f.info;countEl.textContent=f.count||'';
    const hot=(cfg.hot&&cfg.hot[f.phase])||[];tEls.forEach((e,i)=>e.classList.toggle('hot',hot.indexOf(i)>=0));
  }
  function stop(){if(timer){clearInterval(timer);timer=null;}wrap.querySelector('#gdPlay').textContent='▶ play';}
  function play(){if(timer){stop();return;}if(idx>=frames.length-1)idx=0;wrap.querySelector('#gdPlay').textContent='❚❚ pause';timer=setInterval(()=>{if(idx>=frames.length-1){stop();return;}idx++;draw();},680);}
  wrap.querySelector('#gdPlay').onclick=play;
  wrap.querySelector('#gdStep').onclick=()=>{stop();if(idx<frames.length-1){idx++;draw();}};
  wrap.querySelector('#gdReset').onclick=()=>{stop();idx=0;draw();};
  draw();
}

/* ====================== 3D GRAPH ENGINE (three.js) ====================== */
let active3D=null;
function dispose3D(){ if(active3D){ try{active3D.cancel();}catch(e){} active3D=null; } }

function genGraph(cfg){
  const N=cfg.nodes.length, E=cfg.edges, mode=cfg.mode;
  const directed=!!cfg.directed;
  const adj=Array.from({length:N},()=>[]);
  E.forEach(e=>{adj[e[0]].push(e[1]); if(!directed) adj[e[1]].push(e[0]);});
  const LP=['#00e5ff','#39c0f0','#7c93ff','#bf5af2','#f78fb3','#ff9f0a','#69ff47'];
  const IDLE={c:'#2a3340',ei:0.08};
  const labels=cfg.nodes.map((nd,i)=>nd.label!=null?String(nd.label):String(i));
  const frames=[];
  const eVis=vis=>E.map(e=>vis[e[0]]&&vis[e[1]]);

  if(mode==='components'){
    const comp=Array(N).fill(-1),cc=Array(N).fill(null);let c=0;
    frames.push({node:Array(N).fill(IDLE),edge:E.map(()=>false),info:`Scan all nodes; each unvisited one starts a new component.`,count:`components: 0`,phase:'seed'});
    for(let s=0;s<N;s++) if(comp[s]<0){
      c++; const colr=LP[(c-1)%LP.length]; let ring=[s];comp[s]=c;cc[s]=colr;let first=true;
      while(ring.length){
        const fs=ring.slice();
        const node=comp.map((q,i)=> q<0?IDLE:{c:cc[i],ei: fs.indexOf(i)>=0?0.9:0.4});
        frames.push({node,edge:eVis(comp.map(q=>q>=0)),info:first?`New component #${c} — flood it.`:`Spreading component #${c}…`,count:`components: ${c}`,phase:first?'seed':'step'});
        first=false;const nx=[];
        ring.forEach(nd=>adj[nd].forEach(nb=>{if(comp[nb]<0){comp[nb]=c;cc[nb]=colr;nx.push(nb);}}));
        ring=nx;
      }
    }
    frames.push({node:comp.map((q,i)=>q<0?IDLE:{c:cc[i],ei:0.45}),edge:eVis(comp.map(q=>q>=0)),info:`Done — <b>${c}</b> connected components.`,count:`components: ${c}`,phase:'done'});
    return frames;
  }
  if(mode==='bipartite'){
    const color=Array(N).fill(-1),start=cfg.start||0;color[start]=0;const q=[start];let h=0,bad=-1;const COL=['#00e5ff','#ff9f0a'];
    const fr=(info,phase,red)=>{const node=color.map(cl=> cl<0?IDLE:{c:COL[cl],ei:0.5});frames.push({node,edge:eVis(color.map(cl=>cl>=0)),info,count:bad>=0?'bipartite: NO':'bipartite: ok so far',phase,edgeRed:red});};
    fr(`Colour the start node 0 (cyan).`,'seed');
    while(h<q.length){const nd=q[h++];for(const nb of adj[nd]){ if(color[nb]===-1){color[nb]=color[nd]^1;q.push(nb);fr(`Neighbour gets the OPPOSITE colour.`,'step');} else if(color[nb]===color[nd]){let ke=E.findIndex(e=>(e[0]===nd&&e[1]===nb)||(e[0]===nb&&e[1]===nd));bad=ke;fr(`Two same-coloured nodes share an edge → <b>NOT bipartite</b>.`,'step',ke);} } }
    fr(bad>=0?`Not bipartite.`:`Every edge joins opposite colours → <b>bipartite ✓</b>.`,'done',bad>=0?bad:undefined);
    return frames;
  }
  if(mode==='topo'){
    const indeg=Array(N).fill(0);E.forEach(e=>indeg[e[1]]++);const placed=Array(N).fill(-1);let lvl=0;
    let layer=[];for(let i=0;i<N;i++) if(indeg[i]===0)layer.push(i);
    const id2=indeg.slice();
    const fr=(info,phase)=>{frames.push({node:placed.map(pp=> pp<0?IDLE:{c:LP[pp%LP.length],ei:0.5}),edge:eVis(placed.map(pp=>pp>=0)),info,count:`placed: ${placed.filter(pp=>pp>=0).length}/${N}`,phase});};
    fr(`indegree-0 nodes have no prerequisites — they go first.`,'seed');
    while(layer.length){
      layer.forEach(nd=>placed[nd]=lvl);
      fr(`Layer ${lvl}: place these, then free their dependents.`,'step');
      const nxt=[];layer.forEach(nd=>adj[nd].forEach(nb=>{if(--id2[nb]===0)nxt.push(nb);}));
      lvl++;layer=nxt;
    }
    fr(`Done — a valid topological order, layer by layer.`,'done');
    return frames;
  }
  if(mode==='bidir'){
    const owner=Array(N).fill(-1),start=cfg.start||0,end=cfg.end!=null?cfg.end:N-1;owner[start]=0;owner[end]=1;const COL=['#00e5ff','#f78fb3'];let met=-1;
    let rA=[start],rB=[end];
    const fr=(info,phase)=>{frames.push({node:owner.map(o=> o<0?IDLE:{c:COL[o],ei:0.55}),edge:eVis(owner.map(o=>o>=0)),info,count:met>=0?'frontiers met!':'searching…',phase});};
    fr(`Start from BOTH ends at once.`,'seed');
    let guard=0;
    while((rA.length||rB.length)&&met<0&&guard++<20){
      const exp=(ring,o,other)=>{const nx=[];for(const nd of ring)for(const nb of adj[nd]){if(owner[nb]===other)met=1;if(owner[nb]<0){owner[nb]=o;nx.push(nb);}}return nx;};
      rA=exp(rA,0,1); fr(`Cyan frontier expands one ring.`,'step'); if(met>=0)break;
      rB=exp(rB,1,0); fr(`Pink frontier expands one ring.`,'step');
    }
    fr(met>=0?`The two frontiers <b>met</b> — path found in ~half the work.`:`Search complete.`,'done');
    return frames;
  }

  /* ---- detailed per-pop BFS with a live queue (bfs / cycle / wordladder) ---- */
  const isCycle=mode==='cycle', isWL=mode==='wordladder';
  const start=cfg.start||0, end=cfg.end;
  const vis=Array(N).fill(0),par=Array(N).fill(-1),dist=Array(N).fill(-1),done=Array(N).fill(false);
  const q=[]; vis[start]=1; dist[start]=0; q.push(start);
  const QAM={c:'#f0a500',ei:0.55}, CUR={c:'#ffffff',ei:1.0}, RED={c:'#ff4d5e',ei:0.95};
  function snap(info,phase,cur,redPair){
    const node=[];
    for(let i=0;i<N;i++){
      if(redPair&&(i===redPair[0]||i===redPair[1])) node.push(RED);
      else if(i===cur) node.push(CUR);
      else if(done[i]) node.push({c:LP[dist[i]%LP.length],ei:0.45});
      else if(vis[i]) node.push(QAM);
      else node.push(IDLE);
    }
    const qd=q.map(id=> isCycle?(labels[id]+'←'+(par[id]<0?'·':labels[par[id]])):labels[id]);
    const er=redPair?E.findIndex(e=>(e[0]===redPair[0]&&e[1]===redPair[1])||(e[0]===redPair[1]&&e[1]===redPair[0])):undefined;
    frames.push({node,edge:eVis(vis.map(x=>x>0)),queue:qd,info,count:isWL?`words reached: ${vis.filter(x=>x).length}`:(isCycle?'':`visited: ${vis.filter(x=>x).length}/${N}`),phase,edgeRed:er});
  }
  snap(isWL?`Push the start word <b>"${labels[start]}"</b> into the queue.`:`Push the start node <b>${labels[start]}</b> into the queue (distance 0).`,'seed',-1);
  let cyc=false, cycPair;
  while(q.length && !cyc){
    const node=q.shift();
    if(isWL && node===end){ snap(`Pop <b>"${labels[node]}"</b> = target → shortest transformation found in <b>${dist[node]+1}</b> words!`,'done',node); return frames; }
    snap(isWL?`<b>Pop "${labels[node]}"</b> — try changing each letter a..z.`:`<b>Pop ${labels[node]}</b> — scan its neighbours.`,'pop',node);
    const pushed=[];
    for(const nb of adj[node]){
      if(!vis[nb]){ vis[nb]=1; par[nb]=node; dist[nb]=dist[node]+1; q.push(nb); pushed.push(nb); }
      else if(isCycle && nb!==par[node]){ cyc=true; cycPair=[node,nb]; break; }
    }
    done[node]=true;
    if(cyc){ snap(`${labels[node]} reaches <b>${labels[cycPair[1]]}</b> — already visited &amp; <b>not its parent</b> → <b>CYCLE FOUND</b>.`,'cycle',node,cycPair); break; }
    const names=pushed.map(x=>labels[x]);
    snap(pushed.length? (isWL?`In-dictionary neighbours <b>${names.join(', ')}</b> → push.`:`${labels[node]} pushes <b>${names.join(', ')}</b> into the queue.`) : `${labels[node]} has no new neighbours.`,'push',-1);
  }
  if(!cyc) snap(isCycle?`Queue drained, never hit a back-edge → <b>no cycle</b>.`:(isWL?`Queue empty — target not reachable.`:`Queue empty — BFS complete.`),'done',-1);
  return frames;
}
