<script>
/* ════════════════ SHARED GRAPH (used by Dijkstra / Prim / Kruskal) ════════════════ */
const NODES=[[60,168],[182,66],[182,270],[330,66],[330,270],[462,168]];
const EDGES=[[0,1,2],[0,2,4],[1,2,1],[1,3,7],[2,4,3],[3,4,2],[3,5,1],[4,5,5]];
const N=NODES.length;
const ek=(a,b)=>a<b?a+'-'+b:b+'-'+a;
const ADJ=Array.from({length:N},()=>[]);
EDGES.forEach(([a,b,w])=>{ADJ[a].push([b,w]);ADJ[b].push([a,w]);});
const GROUPCOL=['#69ff47','#00e5ff','#f78fb3','#ffd60a','#bf5af2','#ff9f0a'];

/* graphs for the directed / topo / all-pairs patterns */
const UG ={nodes:NODES,edges:EDGES,directed:false,weighted:true};
const DAG_E=[[0,1,2],[0,2,4],[1,2,1],[1,3,7],[2,4,3],[3,4,2],[3,5,1],[4,5,5]];
const DAG={nodes:NODES,edges:DAG_E,directed:true,weighted:true};            // shortest path in DAG
const TOPOG={nodes:NODES,edges:DAG_E,directed:true,weighted:false};         // Kahn topo
const BN=[[60,170],[215,64],[215,276],[388,64],[388,276]];
const BE=[[0,1,6],[0,3,7],[1,2,5],[1,3,8],[1,4,-4],[2,1,-2],[3,2,-3],[3,4,9],[4,0,2],[4,2,7]];
const BG={nodes:BN,edges:BE,directed:true,weighted:true};                   // Bellman-Ford (CLRS, neg edge)
const FN=[[120,82],[372,82],[120,262],[372,262]];
const FE=[[0,1,3],[1,2,2],[2,3,1],[3,0,2],[0,3,7],[2,0,5]];
const FG={nodes:FN,edges:FE,directed:true,weighted:true};                   // Floyd-Warshall
const WN=[[60,170],[205,72],[205,268],[360,170],[472,170]];
const WE=[[0,1,1],[0,2,1],[1,3,1],[2,3,1],[3,4,1]];
const WG={nodes:WN,edges:WE,directed:false,weighted:true};                  // number of ways
const DSUG={nodes:NODES,dsu:true};
function adjOf(edges,n,directed){const a=Array.from({length:n},()=>[]);edges.forEach(([u,v,w])=>{a[u].push([v,w]);if(!directed)a[v].push([u,w]);});return a;}
const fmt=x=>x===Infinity?'∞':x;
const dk=(u,v)=>u+'>'+v;

/* ════════════════ FRAME GENERATORS ════════════════ */
// Each returns an array of frames. A frame may carry:
//   node:{i:'current'|'frontier'|'settled'}, edge:{key:'look'|'relax'|'tree'|'cycle'},
//   group:[rootPerNode], parent:[], rank:[], dist:[], pq:[strings],
//   edgeList:[[w,u,v]], edgeIdx, cost, msg, line

function genDijkstra(){
  const F=[]; const dist=Array(N).fill(Infinity), settled=Array(N).fill(false);
  let pq=[];
  const pqStr=()=>pq.slice().sort((a,b)=>a[0]-b[0]).map(([d,u])=>d+':'+u);
  const base=(o={})=>{
    const node={}; for(let i=0;i<N;i++) if(settled[i]) node[i]='settled';
    Object.assign(node,o.node||{});
    return {dist:dist.slice(),pq:pqStr(),node,edge:o.edge||{},msg:o.msg||'',line:o.line??0};
  };
  dist[0]=0; pq.push([0,0]);
  F.push(base({node:{0:'current'},line:0,msg:`Start: <b>dist[0]=0</b>, push {0,0} into the min-heap. Everything else is ∞.`}));
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]); const [d,u]=pq.shift();
    F.push(base({node:{[u]:'current'},line:2,msg:`Pop the smallest: node <b>${u}</b> at distance <b>${d}</b>.`}));
    if(d>dist[u]){ F.push(base({node:{[u]:'settled'},line:3,msg:`Stale entry (${d} &gt; dist[${u}]=${dist[u]}) → <b>skip</b>.`})); continue; }
    settled[u]=true;
    F.push(base({node:{[u]:'current'},line:4,msg:`Settle <b>${u}</b> — its shortest distance is now <b>locked at ${dist[u]}</b>. Scan its edges.`}));
    for(const [v,w] of ADJ[u]){
      if(settled[v]) continue;
      const nd=dist[u]+w;
      if(nd<dist[v]){
        const old=dist[v]; dist[v]=nd; pq.push([nd,v]);
        F.push(base({node:{[u]:'settled',[v]:'frontier'},edge:{[ek(u,v)]:'relax'},line:6,
          msg:`<b>Relax</b> ${u}→${v} (w=${w}): ${dist[u]}+${w}=${nd} &lt; ${old===Infinity?'∞':old} ⇒ dist[${v}]=<b>${nd}</b>, push {${nd},${v}}.`}));
      } else {
        F.push(base({node:{[u]:'settled',[v]:'frontier'},edge:{[ek(u,v)]:'look'},line:5,
          msg:`Check ${u}→${v} (w=${w}): ${dist[u]}+${w}=${nd} ≥ ${dist[v]===Infinity?'∞':dist[v]} ⇒ no improvement.`}));
      }
    }
  }
  for(let i=0;i<N;i++) settled[i]=true;
  F.push(base({line:-1,msg:`<span class="ok">Done.</span> Shortest distances from 0 = [${dist.join(', ')}].`}));
  return F;
}

function genPrim(){
  const F=[]; const vis=Array(N).fill(false); const tree={}; let cost=0;
  let pq=[[0,0,-1]]; // [w, node, parent]
  const pqStr=()=>pq.slice().sort((a,b)=>a[0]-b[0]).map(([w,u])=>w+':'+u);
  const nodeBase=()=>{const o={};for(let i=0;i<N;i++)if(vis[i])o[i]='settled';return o;};
  const snap=(o={})=>F.push({pq:pqStr(),edge:Object.assign({},tree,o.edge||{}),cost,
    node:Object.assign(nodeBase(),o.node||{}),msg:o.msg||'',line:o.line??0});
  snap({line:0,msg:`Push the start node 0 with weight 0 into the min-heap.`});
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]); const [w,u,par]=pq.shift();
    snap({line:2,node:{[u]:'current'},msg:`Pop cheapest crossing edge → reaches node <b>${u}</b> for cost ${w}.`});
    if(vis[u]){ snap({line:3,node:{[u]:'settled'},msg:`Node ${u} already in the tree → <b>skip</b> (lazy delete).`}); continue; }
    vis[u]=true; cost+=w; if(par>=0) tree[ek(par,u)]='tree';
    snap({line:4,node:{[u]:'current'},edge:par>=0?{[ek(par,u)]:'tree'}:{},
      msg:`Add <b>${u}</b> to the MST${par>=0?` via edge ${par}–${u} (w=${w})`:''}. Total cost = <b>${cost}</b>.`});
    let pushed=[]; for(const [v,wt] of ADJ[u]) if(!vis[v]){ pq.push([wt,v,u]); pushed.push(`${wt}:${v}`); }
    snap({line:6,node:{[u]:'settled'},msg:pushed.length?`Offer ${u}'s edges to unvisited neighbors → push ${pushed.join(', ')}.`:`No new neighbors to offer.`});
  }
  F.push({pq:[],edge:Object.assign({},tree),cost,node:nodeBase(),line:-1,
    msg:`<span class="ok">MST complete.</span> Total weight = <b>${cost}</b> (5 edges for 6 nodes).`});
  return F;
}

function genKruskal(){
  const F=[];
  const E=EDGES.map(([a,b,w])=>[w,Math.min(a,b),Math.max(a,b)]).sort((x,y)=>x[0]-y[0]);
  const parent=[...Array(N).keys()], rnk=Array(N).fill(0);
  const find=x=>{while(parent[x]!==x){parent[x]=parent[parent[x]];x=parent[x];}return x;};
  const unite=(a,b)=>{let pa=find(a),pb=find(b);if(rnk[pa]<rnk[pb]){const t=pa;pa=pb;pb=t;}parent[pb]=pa;if(rnk[pa]===rnk[pb])rnk[pa]++;};
  const groups=()=>{const r=Array(N);for(let i=0;i<N;i++)r[i]=find(i);return r;};
  const tree={}; let cost=0;
  const snap=(o={})=>F.push({group:groups(),edge:Object.assign({},tree,o.edge||{}),
    edgeList:E,edgeIdx:o.edgeIdx??-1,cost,node:o.node||{},msg:o.msg||'',line:o.line??0});
  snap({line:0,msg:`Sort every edge by weight (ascending), then sweep cheapest-first.`});
  E.forEach(([w,u,v],i)=>{
    snap({line:2,edgeIdx:i,edge:{[ek(u,v)]:'look'},node:{[u]:'current',[v]:'current'},
      msg:`Edge <b>${u}–${v}</b> (w=${w}): is find(${u}) == find(${v})?`});
    if(find(u)!==find(v)){
      unite(u,v); tree[ek(u,v)]='tree'; cost+=w;
      snap({line:4,edgeIdx:i,node:{[u]:'settled',[v]:'settled'},
        msg:`Different sets → <b>add to MST</b> &amp; merge them. Total cost = <b>${cost}</b>.`});
    } else {
      snap({line:5,edgeIdx:i,edge:{[ek(u,v)]:'cycle'},node:{[u]:'current',[v]:'current'},
        msg:`<span class="bad">Same set</span> → adding it would make a cycle. <b>Skip.</b>`});
    }
  });
  snap({line:-1,msg:`<span class="ok">MST complete.</span> Total weight = <b>${cost}</b> — all 6 nodes now share one root.`});
  return F;
}

function genDSU(){
  const F=[];
  const parent=[...Array(N).keys()], rnk=Array(N).fill(0);
  const groups=()=>{const r=Array(N);for(let i=0;i<N;i++){let x=i;while(parent[x]!==x)x=parent[x];r[i]=x;}return r;};
  const snap=(o={})=>F.push({parent:parent.slice(),rank:rnk.slice(),group:groups(),
    node:o.node||{},msg:o.msg||'',line:o.line??0});
  function findPath(x){ let p=[],c=x; while(parent[c]!==c){p.push(c);c=parent[c];} return {root:c,path:p}; }
  function unite(a,b){
    snap({line:3,node:{[a]:'current',[b]:'current'},msg:`<b>unite(${a}, ${b})</b> → find the root of each.`});
    let {root:pa}=findPath(a), {root:pb}=findPath(b);
    snap({line:4,node:{[pa]:'frontier',[pb]:'frontier'},msg:`Roots are ${pa} and ${pb}.`});
    if(pa===pb){ snap({line:5,node:{[pa]:'settled'},msg:`Same root → already one set, nothing to do.`}); return; }
    if(rnk[pa]<rnk[pb]){ const t=pa;pa=pb;pb=t;
      snap({line:6,node:{[pa]:'frontier',[pb]:'frontier'},msg:`rank[${pb}] is taller → swap so the taller tree (${pa}) stays the root.`}); }
    parent[pb]=pa; let inc='';
    if(rnk[pa]===rnk[pb]){ rnk[pa]++; inc=` Equal ranks ⇒ rank[${pa}]→${rnk[pa]}.`; }
    snap({line:7,node:{[pa]:'settled',[pb]:'settled'},msg:`Attach ${pb} under ${pa}.${inc}`});
  }
  function findCompress(x){
    const {root,path}=findPath(x);
    snap({line:0,node:{[x]:'current'},msg:`<b>find(${x})</b> walks up: ${[x,...path.map(p=>parent[p]),].slice(0, path.length+1).join(' → ')} → root <b>${root}</b>.`});
    if(path.length){ path.forEach(p=>parent[p]=root);
      snap({line:2,node:{[x]:'settled',[root]:'settled'},msg:`<b>Path compression</b>: point ${path.join(', ')} straight at root ${root}. Future finds are instant.`}); }
    return root;
  }
  snap({line:-2,msg:`Start: 6 singleton sets — every node is its own root (parent[i]=i, rank=0).`});
  unite(1,2); unite(3,5); unite(0,1); unite(3,4); unite(2,4);
  findCompress(5);
  snap({line:-1,node:{},msg:`<span class="ok">All 6 nodes in one set.</span> With rank + compression, find/unite cost ~O(α(n)) — effectively constant.`});
  return F;
}

function genKahn(){
  const g=TOPOG,n=g.nodes.length,adj=adjOf(g.edges,n,true),F=[];
  const indeg=Array(n).fill(0); g.edges.forEach(([u,v])=>indeg[v]++);
  let q=[]; const order=[];
  const snap=(o={})=>F.push({indeg:indeg.slice(),fifo:q.slice(),order:order.slice(),node:o.node||{},edge:o.edge||{},msg:o.msg||'',line:o.line??0});
  snap({line:0,msg:`Count in-degrees — how many edges point <i>into</i> each node.`});
  for(let i=0;i<n;i++) if(indeg[i]===0) q.push(i);
  snap({line:1,node:Object.fromEntries(q.map(x=>[x,'frontier'])),msg:`Push every node with in-degree 0 → queue starts [${q.join(', ')}] (the "sources").`});
  while(q.length){
    const u=q.shift(); order.push(u);
    snap({line:3,node:{[u]:'current'},msg:`Pop <b>${u}</b> → append to topo order. Order: [${order.join(', ')}].`});
    for(const [v] of adj[u]){
      indeg[v]--;
      if(indeg[v]===0){ q.push(v); snap({line:5,node:{[u]:'settled',[v]:'frontier'},edge:{[dk(u,v)]:'tree'},msg:`Edge ${u}→${v}: in-degree[${v}] hits 0 → push ${v}.`}); }
      else snap({line:4,node:{[u]:'settled',[v]:'current'},edge:{[dk(u,v)]:'look'},msg:`Edge ${u}→${v}: in-degree[${v}] = ${indeg[v]} (still waiting on other parents).`});
    }
  }
  snap({line:6,node:Object.fromEntries(order.map(x=>[x,'settled'])),msg:order.length===n?`<span class="ok">Valid order:</span> [${order.join(' → ')}]. order.size==V ⇒ no cycle — this is exactly Course Schedule's yes/no answer.`:`<span class="bad">Cycle!</span> only ${order.length}/${n} placed.`});
  return F;
}

function genDAGsp(){
  const g=DAG,n=g.nodes.length,adj=adjOf(g.edges,n,true),F=[];
  const ind=Array(n).fill(0); g.edges.forEach(([u,v])=>ind[v]++);
  let q=[],topo=[]; for(let i=0;i<n;i++) if(!ind[i])q.push(i);
  while(q.length){const u=q.shift();topo.push(u);for(const[v]of adj[u])if(--ind[v]===0)q.push(v);}
  const dist=Array(n).fill(Infinity); dist[0]=0; const settled=Array(n).fill(false);
  const snap=(o={})=>{const node={};for(let i=0;i<n;i++)if(settled[i])node[i]='settled';Object.assign(node,o.node||{});F.push({dist:dist.slice(),order:topo.slice(),node,edge:o.edge||{},msg:o.msg||'',line:o.line??0});};
  snap({line:0,msg:`Get a topological order first: [${topo.join(', ')}]. Then relax strictly in that order.`});
  snap({line:1,node:{0:'current'},msg:`dist[0]=0, everything else ∞.`});
  topo.forEach((u)=>{
    settled[u]=true;
    snap({line:2,node:{[u]:'current'},msg:`Take <b>${u}</b> from topo order. All paths into it are finalized ⇒ dist[${u}]=${fmt(dist[u])} is locked.`});
    if(dist[u]===Infinity) return;
    for(const [v,w] of adj[u]){
      const nd=dist[u]+w;
      if(nd<dist[v]){const old=dist[v];dist[v]=nd;snap({line:5,node:{[u]:'settled',[v]:'frontier'},edge:{[dk(u,v)]:'relax'},msg:`Relax ${u}→${v} (w=${w}): ${dist[u]}+${w}=${nd} &lt; ${fmt(old)} ⇒ dist[${v}]=<b>${nd}</b>.`});}
      else snap({line:4,node:{[u]:'settled',[v]:'frontier'},edge:{[dk(u,v)]:'look'},msg:`Check ${u}→${v}: ${dist[u]}+${w}=${nd} ≥ ${fmt(dist[v])} ⇒ keep.`});
    }
  });
  for(let i=0;i<n;i++)settled[i]=true;
  snap({line:-1,msg:`<span class="ok">Done in O(V+E)</span> — no heap needed. dist = [${dist.map(fmt).join(', ')}].`});
  return F;
}

function genBellman(){
  const g=BG,n=g.nodes.length,E=g.edges,F=[];
  const dist=Array(n).fill(Infinity); dist[0]=0;
  const snap=(o={})=>F.push({dist:dist.slice(),round:o.round,node:o.node||{},edge:o.edge||{},msg:o.msg||'',line:o.line??0});
  snap({line:0,node:{0:'current'},msg:`Source 0: dist[0]=0, rest ∞. Relax <b>all ${E.length} edges</b>, V−1 = ${n-1} times.`});
  for(let i=1;i<=n-1;i++){
    let changed=false;
    snap({line:0,round:i,msg:`<b>Round ${i}/${n-1}</b> — sweep every edge once.`});
    for(const [u,v,w] of E){
      if(dist[u]===Infinity) continue;
      const nd=dist[u]+w;
      if(nd<dist[v]){const old=dist[v];dist[v]=nd;changed=true;snap({line:2,round:i,node:{[u]:'settled',[v]:'frontier'},edge:{[dk(u,v)]:'relax'},msg:`Relax ${u}→${v} (w=${w}): ${dist[u]}+${w}=${nd} &lt; ${fmt(old)} ⇒ dist[${v}]=<b>${nd}</b>${w<0?' <span style="color:#ffd479">(negative edge!)</span>':''}.`});}
    }
    if(!changed){ snap({line:2,round:i,msg:`No edge improved → distances converged early, stop.`}); break; }
  }
  let neg=false; for(const [u,v,w] of E){ if(dist[u]!==Infinity && dist[u]+w<dist[v]){neg=true;break;} }
  snap({line:4,node:Object.fromEntries([...Array(n)].map((_,i)=>[i,'settled'])),msg:neg?`<span class="bad">Negative cycle</span> — a Vth pass still relaxes.`:`<span class="ok">Done.</span> dist = [${dist.map(fmt).join(', ')}] — note the negative result, which Dijkstra could never produce.`});
  return F;
}

function genFloyd(){
  const g=FG,n=g.nodes.length,F=[];
  const d=Array.from({length:n},(_,i)=>Array.from({length:n},(_,j)=>i===j?0:Infinity));
  g.edges.forEach(([u,v,w])=>{d[u][v]=Math.min(d[u][v],w);});
  const M=()=>d.map(r=>r.slice());
  const snap=(o={})=>F.push({matrix:M(),fk:o.fk,fi:o.fi,fj:o.fj,node:o.node||{},msg:o.msg||'',line:o.line??0});
  snap({line:0,msg:`Init the matrix: 0 on the diagonal, edge weights where an edge exists, ∞ otherwise.`});
  for(let k=0;k<n;k++){
    snap({line:0,fk:k,node:{[k]:'current'},msg:`<b>k=${k}</b> — now allow paths that route <i>through</i> node ${k}.`});
    for(let i=0;i<n;i++)for(let j=0;j<n;j++){
      if(d[i][k]+d[k][j]<d[i][j]){const old=d[i][j];d[i][j]=d[i][k]+d[k][j];snap({line:4,fk:k,fi:i,fj:j,node:{[k]:'current',[i]:'frontier',[j]:'frontier'},msg:`d[${i}][${j}] via ${k}: ${fmt(d[i][k])}+${fmt(d[k][j])} = <b>${d[i][j]}</b> &lt; ${fmt(old)} ⇒ update.`});}
    }
  }
  snap({line:-1,node:Object.fromEntries([...Array(n)].map((_,i)=>[i,'settled'])),msg:`<span class="ok">All-pairs shortest paths</span> in O(V³). Row i = shortest distance from i to every other node.`});
  return F;
}

function genWays(){
  const g=WG,n=g.nodes.length,adj=adjOf(g.edges,n,false),F=[],MOD=1e9+7;
  const dist=Array(n).fill(Infinity),ways=Array(n).fill(0),settled=Array(n).fill(false);
  let pq=[]; const pqStr=()=>pq.slice().sort((a,b)=>a[0]-b[0]).map(([d,u])=>d+':'+u);
  const snap=(o={})=>{const node={};for(let i=0;i<n;i++)if(settled[i])node[i]='settled';Object.assign(node,o.node||{});F.push({dist:dist.slice(),ways:ways.slice(),pq:pqStr(),node,edge:o.edge||{},msg:o.msg||'',line:o.line??0});};
  dist[0]=0; ways[0]=1; pq.push([0,0]);
  snap({line:0,node:{0:'current'},msg:`dist[0]=0, <b>ways[0]=1</b>. Push {0,0}.`});
  while(pq.length){
    pq.sort((a,b)=>a[0]-b[0]); const [d,u]=pq.shift();
    if(settled[u]) continue; settled[u]=true;
    snap({line:2,node:{[u]:'current'},msg:`Settle <b>${u}</b> (dist ${d}, ways ${ways[u]}).`});
    for(const [v,w] of adj[u]){
      const nd=d+w;
      if(nd<dist[v]){dist[v]=nd;ways[v]=ways[u];pq.push([nd,v]);snap({line:4,node:{[u]:'settled',[v]:'frontier'},edge:{[ek(u,v)]:'relax'},msg:`Shorter route to ${v}: dist[${v}]=${nd}, <b>ways[${v}] = ways[${u}] = ${ways[v]}</b> (inherit).`});}
      else if(nd===dist[v]){ways[v]=(ways[v]+ways[u])%MOD;snap({line:5,node:{[u]:'settled',[v]:'frontier'},edge:{[ek(u,v)]:'look'},msg:`<b>Equal</b>-length route to ${v} ⇒ ways[${v}] += ways[${u}] = <b>${ways[v]}</b>.`});}
    }
  }
  for(let i=0;i<n;i++)settled[i]=true;
  snap({line:-1,msg:`<span class="ok">Done.</span> Shortest 0→${n-1} = ${dist[n-1]} with <b>${ways[n-1]} distinct shortest paths</b>.`});
  return F;
}

class DSU {
    vector<int> parent, rnk;
public:
    DSU(int n){
        parent.resize(n); rnk.assign(n, 0);
        for(int i = 0; i < n; i++) parent[i] = i;  // each its own set
    }
    int find(int x){
        if(parent[x] == x) return x;               // x is a root
        return parent[x] = find(parent[x]);        // ★ path compression
    }
    void unite(int a, int b){
        int pa = find(a), pb = find(b);
        if(pa == pb) return;                       // already same set
        if(rnk[pa] < rnk[pb]) swap(pa, pb);        // smaller under bigger

        if(rnk[pa] == rnk[pb]) rnk[pa]++;          // tie → root grows
    }

/* ════════════════ SYNTAX HIGHLIGHT + CLICK-TO-REVEAL ════════════════ */
function hl(code){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return code.split('\n').map(line=>{
    const ci=line.indexOf('//');
    const codePart=ci>=0?line.slice(0,ci):line;
    const comPart =ci>=0?line.slice(ci) :'';
    let h=esc(codePart)
      .replace(/\b(class|public|private|struct|int|void|bool|long|auto|vector|queue|priority_queue|greater|pair|array|return|while|for|if|else|true|false|const|swap|sort|push|pop|push_back|front|top|empty|size|resize|assign|begin|end)\b/g,'<span class="kw">$1</span>')
      .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
    let cls='cl';
    if(comPart){ cls+=' has-cm'; h+='<span class="cm">'+esc(comPart).replace(/(★[^<]*)/g,'<span class="star">$1</span>')+'</span>'; }
    return `<span class="${cls}"><span class="cmdot">●</span>${h===''?'&nbsp;':h}</span>`;
  }).join('');
}

function svgScene(f,g){
  const nodes=g.nodes;
  let s=`<svg viewBox="0 0 522 336" preserveAspectRatio="xMidYMid meet">
    <defs>
      <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#bf5af2"/></marker>
      <marker id="ad" markerWidth="11" markerHeight="11" refX="9" refY="3.2" orient="auto"><path d="M0,0 L9,3.2 L0,6.4 Z" fill="#8b98a8"/></marker>
    </defs>`;
  if(g.dsu){
    for(let i=0;i<nodes.length;i++){ const p=f.parent?f.parent[i]:i; if(p!==i){
      const [x1,y1]=nodes[i],[x2,y2]=nodes[p],dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;
      s+=`<line class="arrow" x1="${x1+ux*22}" y1="${y1+uy*22}" x2="${x2-ux*24}" y2="${y2-uy*24}"/>`;
    }}
  } else {
    (g.edges||[]).forEach(([a,b,w])=>{
      const [x1,y1]=nodes[a],[x2,y2]=nodes[b];
      const key=g.directed?dk(a,b):ek(a,b), cls=(f.edge&&f.edge[key])||'';
      let X1=x1,Y1=y1,X2=x2,Y2=y2, off=0;
      if(g.directed){const dx=x2-x1,dy=y2-y1,L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L;X1=x1+ux*21;Y1=y1+uy*21;X2=x2-ux*24;Y2=y2-uy*24;off=a<b?-9:9;}
      s+=`<line class="ed ${cls}${g.directed?' dir':''}" x1="${X1}" y1="${Y1}" x2="${X2}" y2="${Y2}"/>`;
      if(g.weighted!==false){const mx=(x1+x2)/2,my=(y1+y2)/2+off;
        s+=`<circle class="wbg" cx="${mx}" cy="${my}" r="11"/><text class="wt" x="${mx}" y="${my}">${w}</text>`;}
    });
  }
  nodes.forEach(([x,y],i)=>{
    const st=(f.node&&f.node[i])||''; let stroke='#44505f',fill='#131a22',sw=2.4;
    const grp=f.group?f.group[i]:null;
    if(grp!=null){ stroke=GROUPCOL[grp%GROUPCOL.length]; fill='#10151c'; }
    if(st==='frontier'){ stroke='#00e5ff'; fill='#06222b'; sw=3; }
    if(st==='settled'&&grp==null){ stroke='#69ff47'; fill='#0c2417'; }
    if(st==='current'){ stroke='#ffd60a'; fill='#241d04'; sw=4; }
    const halo = st==='current'?`<circle cx="${x}" cy="${y}" r="27" fill="none" stroke="#ffd60a" stroke-width="1.4" opacity=".5"/>`:'';
    s+=`${halo}<circle cx="${x}" cy="${y}" r="20" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/><text class="nlabel" x="${x}" y="${y}">${i}</text>`;
  });
  return s+'</svg>';
}

function numTable(cap,arr,doneFn){
  let h=`<div class="vtbl"><div class="cap">${cap}</div><table><tr>`;
  for(let i=0;i<arr.length;i++) h+=`<td class="k">${i}</td>`; h+=`</tr><tr>`;
  for(let i=0;i<arr.length;i++) h+=`<td class="${doneFn(i)?'done':''}">${arr[i]===Infinity?'∞':arr[i]}</td>`;
  return h+`</tr></table></div>`;
}
function qpills(label,arr){
  let h=`<div class="qrow"><span class="qlabel">${label}</span>`;
  if(!arr.length) h+=`<span class="qp empty">empty</span>`; else arr.forEach(t=>h+=`<span class="qp">${t}</span>`);
  return h+`</div>`;
}
function matrixPanel(f){
  const m=f.matrix,n=m.length;
  let h=`<div class="vtbl"><div class="cap">dist matrix · k=${f.fk??'–'}</div><table><tr><td class="k"></td>`;
  for(let j=0;j<n;j++) h+=`<td class="k${j===f.fk?' kk':''}">${j}</td>`; h+=`</tr>`;
  for(let i=0;i<n;i++){ h+=`<tr><td class="k${i===f.fk?' kk':''}">${i}</td>`;
    for(let j=0;j<n;j++){ let c=''; if(i===f.fk||j===f.fk)c='kcol'; if(i===f.fi&&j===f.fj)c='cellhot';
      h+=`<td class="${c}">${m[i][j]===Infinity?'∞':m[i][j]}</td>`; }
    h+=`</tr>`; }
  return h+`</table></div>`;
}

function sidePanel(f){
  let h='';
  if(f.dist)  h+=numTable('dist[ ]',f.dist,i=>f.node&&f.node[i]==='settled');
  if(f.ways)  h+=numTable('ways[ ]',f.ways,()=>false);
  if(f.indeg) h+=numTable('in-degree',f.indeg,i=>f.indeg[i]===0);
  if(f.parent){ h+=numTable('parent[ ]',f.parent,i=>f.parent[i]===i)+numTable('rank[ ]',f.rank,()=>false); }
  if(f.order){ h+=`<div class="vtbl"><div class="cap">topo order</div><div class="qrow" style="min-height:0">${f.order.length?f.order.map(x=>`<span class="qp" style="background:#14424f;border-color:#1f7a8a;color:#bdf0ff">${x}</span>`).join(''):'<span class="qp empty">—</span>'}</div></div>`; }
  if(f.edgeList){
    h+=`<div class="vtbl" style="flex:1;min-width:150px"><div class="cap">edges (sorted)</div><div class="elist">`;
    f.edgeList.forEach(([w,u,v],i)=>{ const key=ek(u,v),isTree=f.edge&&f.edge[key]==='tree',isCyc=f.edge&&f.edge[key]==='cycle';
      const cls=(i===f.edgeIdx?'cur ':'')+(isTree?'tree':(isCyc?'cycle':''));
      h+=`<div class="erow ${cls}"><span class="w">w=${w}</span>${u}–${v}${isTree?' ✓':''}</div>`; });
    h+=`</div></div>`;
  }
  if(f.matrix) h+=matrixPanel(f);
  let h2='';
  if(f.pq)   h2+=qpills('MIN-HEAP ↓',f.pq);
  if(f.fifo) h2+=qpills('QUEUE →',f.fifo);
  if(f.cost!=null)  h2+=`<div class="cost">MST cost = ${f.cost}</div>`;
  if(f.round!=null) h2+=`<div class="cost" style="color:#ffd479">relaxation round ${f.round}</div>`;
  return {tables:h, heap:h2};
}

function mountStepper(p){
  const frames=p.gen();
  const stage=main.querySelector('#stage'), vmsg=main.querySelector('#vmsg'),
        vtables=main.querySelector('#vtables'), vpos=main.querySelector('#vpos'),
        traceEl=main.querySelector('#trace'), playBtn=main.querySelector('#play'),
        spd=main.querySelector('#spd'), spdlbl=main.querySelector('#spdlbl');
  const tEls=[]; p.trace.forEach(ln=>{const x=document.createElement('span');x.className='tln';x.innerHTML=hl(ln)||'&nbsp;';traceEl.appendChild(x);tEls.push(x);});
  let idx=0;
  function draw(){
    const f=frames[idx];
    stage.innerHTML=svgScene(f,p.graph);
    vmsg.classList.remove('flash');void vmsg.offsetWidth;vmsg.classList.add('flash');
    vmsg.innerHTML=`<span class="stepchip">STEP ${idx+1}</span>${f.msg}`;
    const sp=sidePanel(f);
    vtables.innerHTML=(sp.heap?`<div style="flex:1;min-width:100%">${sp.heap}</div>`:'')+sp.tables;
    tEls.forEach((e,i)=>e.classList.toggle('hot',i===f.line));
    vpos.textContent=`${idx+1} / ${frames.length}`;
  }
  function stop(){if(stepTimer){clearInterval(stepTimer);stepTimer=null;}playBtn.textContent='▶ play';}
  function play(){ if(stepTimer){stop();return;} if(idx>=frames.length-1)idx=0;
    playBtn.textContent='❚❚ pause';
    stepTimer=setInterval(()=>{ if(idx>=frames.length-1){stop();return;} idx++;draw(); }, +spd.value);
  }
  const setspd=()=>{spdlbl.textContent=(spd.value/1000).toFixed(2)+'s'; if(stepTimer){clearInterval(stepTimer);stepTimer=setInterval(()=>{if(idx>=frames.length-1){stop();return;}idx++;draw();},+spd.value);}};
  spd.oninput=setspd; setspd();
  playBtn.onclick=play;
  main.querySelector('#stepBtn').onclick=()=>{stop();if(idx<frames.length-1){idx++;draw();}};
  main.querySelector('#resetBtn').onclick=()=>{stop();idx=0;draw();};
  draw();
}

render();
</script>
</body>
</html>
