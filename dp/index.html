<script>
/* ════════════════ DP TABLE ENGINE ════════════════ */
function svgFrame(f){
  const g=f.dp||[[]], R=g.length, C=g[0].length;
  const cw=46, ch=32, gap=4, padL=f.rowH?92:20, padT=f.colH?34:18;
  const xOf=c=>padL+c*(cw+gap), yOf=r=>padT+r*(ch+gap);
  const W=Math.max(xOf(C)-gap+14,200), H=yOf(R)-gap+14;
  let s=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">`;
  if(f.colH) f.colH.forEach((t,c)=>s+=`<text class="aidx" x="${xOf(c)+cw/2}" y="${padT-10}">${t}</text>`);
  if(f.rowH) f.rowH.forEach((t,r)=>s+=`<text class="aidx" x="${padL-8}" y="${yOf(r)+ch/2}" style="text-anchor:end" dominant-baseline="central">${t}</text>`);
  for(let r=0;r<R;r++)for(let c=0;c<C;c++){
    const st=(f.cells&&f.cells[r+','+c])||''; const v=g[r][c];
    let stroke='#222c38',fill='#0c1118';
    if(v!==''&&v!=null){stroke='#3a4658';fill='#10161e';}
    if(st==='from'){stroke='#ffd60a';fill='#241d04';}
    if(st==='cur'){stroke='#00e5ff';fill='#06222b';}
    if(st==='done'){stroke='#69ff47';fill='#123a1f';}
    if(st==='path'){stroke='#bf5af2';fill='#1e0f2a';}
    s+=`<rect class="acell" x="${xOf(c)}" y="${yOf(r)}" width="${cw}" height="${ch}" rx="6" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`;
    s+=`<text class="aval" x="${xOf(c)+cw/2}" y="${yOf(r)+ch/2}" style="font-size:13px">${v===''||v==null?'':v}</text>`;
  }
  return s+'</svg>';
}
function frameSide(f){
  let heap='';
  if(f.note) heap+=`<div style="font-size:12px;color:#8b949e;line-height:1.55;margin-bottom:6px">${f.note}</div>`;
  if(f.stats) f.stats.forEach(([k,v])=>heap+=`<div class="cost">${k} = ${v}</div>`);
  return {tables:'',heap};
}

/* ════════════════ FRAME GENERATORS ════════════════ */
function genClimb(){
  const n=6,F=[]; const dp=Array(n+1).fill('');
  const colH=[...Array(n+1)].map((_,i)=>i);
  const snap=(cells,msg,line,stats)=>F.push({dp:[dp.slice()],cells,colH,msg,line,stats});
  dp[0]=1; snap({'0,0':'done'},`Base: 1 way to be at step 0 (stand still).`,1);
  dp[1]=1; snap({'0,1':'done'},`Base: 1 way to reach step 1.`,1);
  for(let i=2;i<=n;i++){
    snap({['0,'+i]:'cur',['0,'+(i-1)]:'from',['0,'+(i-2)]:'from'},`dp[${i}] = dp[${i-1}] + dp[${i-2}] = ${dp[i-1]} + ${dp[i-2]}.`,3);
    dp[i]=dp[i-1]+dp[i-2];
    snap({['0,'+i]:'done'},`dp[${i}] = <b>${dp[i]}</b> ways to reach step ${i}.`,3,[['dp['+i+']',dp[i]]]);
  }
  snap(Object.fromEntries([...Array(n+1)].map((_,i)=>['0,'+i,'done'])),`<span class="ok">Answer = dp[${n}] = ${dp[n]} ways.</span>`,4,[['answer',dp[n]]]);
  return F;
}
function genRob(){
  const nums=[2,7,9,3,1],n=nums.length,F=[]; const dp=Array(n).fill('');
  const grid=()=>[nums.slice(),dp.slice()];
  const colH=nums.map((_,i)=>i), rowH=['nums','dp'];
  const snap=(cells,msg,line,stats)=>F.push({dp:grid(),cells,colH,rowH,msg,line,stats});
  dp[0]=nums[0]; snap({'1,0':'done'},`dp[0] = nums[0] = ${nums[0]} (rob the only house).`,1);
  dp[1]=Math.max(nums[0],nums[1]); snap({'1,1':'done','0,0':'from','0,1':'from'},`dp[1] = max(nums[0], nums[1]) = ${dp[1]}.`,2);
  for(let i=2;i<n;i++){
    const skip=dp[i-1], take=dp[i-2]+nums[i];
    snap({['1,'+i]:'cur',['1,'+(i-1)]:'from',['1,'+(i-2)]:'from',['0,'+i]:'from'},`dp[${i}] = max(skip dp[${i-1}]=${skip}, rob ${nums[i]}+dp[${i-2}]=${take}).`,4);
    dp[i]=Math.max(skip,take);
    snap({['1,'+i]:'done'},`dp[${i}] = <b>${dp[i]}</b>.`,4,[['dp['+i+']',dp[i]]]);
  }
  snap(Object.fromEntries(dp.map((_,i)=>['1,'+i,'done'])),`<span class="ok">Max loot = dp[${n-1}] = ${dp[n-1]}.</span>`,5,[['answer',dp[n-1]]]);
  return F;
}
function genCoin(){
  const coins=[1,2,5],amt=6,F=[]; const INF='∞';
  const dp=Array(amt+1).fill(INF); dp[0]=0;
  const colH=[...Array(amt+1)].map((_,i)=>i);
  const snap=(cells,msg,line,stats)=>F.push({dp:[dp.slice()],cells,colH,msg,line,stats});
  snap({'0,0':'done'},`dp[a] = fewest coins for amount a. dp[0]=0, rest = ∞. Coins {${coins.join(', ')}}.`,1);
  for(let a=1;a<=amt;a++){
    let best=Infinity;
    for(const c of coins) if(a-c>=0 && dp[a-c]!==INF) best=Math.min(best, dp[a-c]+1);
    const cells={['0,'+a]:'cur'}; coins.forEach(c=>{ if(a-c>=0) cells['0,'+(a-c)]='from'; });
    snap(cells,`dp[${a}]: 1 + min(dp[${a}−c]) over c∈{${coins.filter(c=>a-c>=0).join(',')}}.`,4);
    dp[a]=best===Infinity?INF:best;
    snap({['0,'+a]:'done'},`dp[${a}] = <b>${dp[a]}</b>.`,4,[['dp['+a+']',dp[a]]]);
  }
  snap(Object.fromEntries([...Array(amt+1)].map((_,i)=>['0,'+i,'done'])),`<span class="ok">Min coins for ${amt} = dp[${amt}] = ${dp[amt]}.</span>`,5,[['answer',dp[amt]]]);
  return F;
}
function genLCS(){
  const A='abcde',B='ace',m=A.length,n=B.length,F=[];
  const dp=[...Array(m+1)].map(()=>Array(n+1).fill(0));
  const colH=['∅',...B.split('')], rowH=['∅',...A.split('')];
  const snap=(cells,msg,line,stats)=>F.push({dp:dp.map(r=>r.slice()),cells,colH,rowH,msg,line,stats});
  snap({},`LCS of "${A}" & "${B}". Row / col 0 = empty string → 0.`,1);
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    const eq=A[i-1]===B[j-1];
    if(eq){ snap({[i+','+j]:'cur',[(i-1)+','+(j-1)]:'from'},`'${A[i-1]}' == '${B[j-1]}' → 1 + diagonal ${dp[i-1][j-1]}.`,4); dp[i][j]=dp[i-1][j-1]+1; }
    else { snap({[i+','+j]:'cur',[(i-1)+','+j]:'from',[i+','+(j-1)]:'from'},`'${A[i-1]}' ≠ '${B[j-1]}' → max(top ${dp[i-1][j]}, left ${dp[i][j-1]}).`,6); dp[i][j]=Math.max(dp[i-1][j],dp[i][j-1]); }
    snap({[i+','+j]:'done'},`dp[${i}][${j}] = <b>${dp[i][j]}</b>.`,eq?4:6);
  }
  snap({[m+','+n]:'done'},`<span class="ok">LCS length = dp[${m}][${n}] = ${dp[m][n]} ("ace").</span>`,7,[['answer',dp[m][n]]]);
  return F;
}
function genKnapsack(){
  const wt=[1,3,4,5],val=[1,4,5,7],cap=7,n=wt.length,F=[];
  const dp=[...Array(n+1)].map(()=>Array(cap+1).fill(0));
  const colH=[...Array(cap+1)].map((_,i)=>i), rowH=['∅',...wt.map((w,i)=>`#${i+1} w${w} v${val[i]}`)];
  const snap=(cells,msg,line,stats)=>F.push({dp:dp.map(r=>r.slice()),cells,colH,rowH,msg,line,stats});
  snap({},`0/1 Knapsack: cap ${cap}, items (weight,value). Row 0 / col 0 = 0.`,1);
  for(let i=1;i<=n;i++)for(let w=0;w<=cap;w++){
    if(wt[i-1]<=w){ const take=val[i-1]+dp[i-1][w-wt[i-1]], skip=dp[i-1][w];
      snap({[i+','+w]:'cur',[(i-1)+','+w]:'from',[(i-1)+','+(w-wt[i-1])]:'from'},`item #${i} fits in ${w} → max(skip ${skip}, take ${val[i-1]}+${dp[i-1][w-wt[i-1]]}=${take}).`,4);
      dp[i][w]=Math.max(skip,take); }
    else { snap({[i+','+w]:'cur',[(i-1)+','+w]:'from'},`item #${i} too heavy for ${w} → copy above ${dp[i-1][w]}.`,6); dp[i][w]=dp[i-1][w]; }
    snap({[i+','+w]:'done'},`dp[${i}][${w}] = <b>${dp[i][w]}</b>.`,4);
  }
  snap({[n+','+cap]:'done'},`<span class="ok">Best value = dp[${n}][${cap}] = ${dp[n][cap]}.</span>`,7,[['answer',dp[n][cap]]]);
  return F;
}
function genUniquePaths(){
  const m=3,nn=4,F=[]; const dp=[...Array(m)].map(()=>Array(nn).fill(''));
  const colH=[...Array(nn)].map((_,i)=>i), rowH=[...Array(m)].map((_,i)=>i);
  const snap=(cells,msg,line,stats)=>F.push({dp:dp.map(r=>r.slice()),cells,colH,rowH,msg,line,stats});
  for(let j=0;j<nn;j++) dp[0][j]=1;
  for(let i=0;i<m;i++) dp[i][0]=1;
  snap(Object.fromEntries([...Array(nn)].map((_,j)=>['0,'+j,'done']).concat([...Array(m)].map((_,i)=>[i+',0','done']))),`First row & column = 1 (a single straight path).`,2);
  for(let i=1;i<m;i++)for(let j=1;j<nn;j++){
    snap({[i+','+j]:'cur',[(i-1)+','+j]:'from',[i+','+(j-1)]:'from'},`dp[${i}][${j}] = dp[${i-1}][${j}] + dp[${i}][${j-1}] = ${dp[i-1][j]} + ${dp[i][j-1]}.`,4);
    dp[i][j]=dp[i-1][j]+dp[i][j-1];
    snap({[i+','+j]:'done'},`dp[${i}][${j}] = <b>${dp[i][j]}</b>.`,4);
  }
  snap({[(m-1)+','+(nn-1)]:'done'},`<span class="ok">Unique paths = dp[${m-1}][${nn-1}] = ${dp[m-1][nn-1]}.</span>`,5,[['answer',dp[m-1][nn-1]]]);
  return F;
}

function hl(code){
  const esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return code.split('\n').map(line=>{
    const ci=line.indexOf('//');
    const codePart=ci>=0?line.slice(0,ci):line, comPart=ci>=0?line.slice(ci):'';
    let h=esc(codePart)
      .replace(/\b(stack|queue|deque|priority_queue|class|struct|public|private|int|long|void|bool|auto|char|string|vector|pair|set|map|return|while|for|do|if|else|true|false|const|nullptr|NULL|new|max|min|push|pop|top|front|back|empty|size|push_back|pop_back|push_front|pop_front|stoi|isdigit|INT_MAX)\b/g,'<span class="kw">$1</span>')
      .replace(/('[^']*')/g,'<span class="str">$1</span>')
      .replace(/&quot;[^&]*&quot;/g,m=>'<span class="str">'+m+'</span>')
      .replace(/\b(\d+)\b/g,'<span class="nm">$1</span>');
    let cls='cl';
    if(comPart){ cls+=' has-cm'; h+='<span class="cm">'+esc(comPart).replace(/(★[^<]*)/g,'<span class="star">$1</span>')+'</span>'; }
    return `<span class="${cls}"><span class="cmdot">●</span>${h===''?'&nbsp;':h}</span>`;
  }).join('');
}
function varPanel(p){
  const vs=VARS[p.label]||[];

  return `<div class="varhead">🔀 VARIATION TEMPLATES — same skeleton, small twists</div>`+

      <pre>${hl(v.code)}</pre>
    </div>`).join('');
}

    <div class="phead">
      <div>
        <span class="ptag" style="background:${col}22;border:1px solid ${col}55;color:${col}">${CAT[p.cat].label}</span>
        <span class="pcount">Pattern ${active+1} / ${P.length}</span>
        <h2>${p.label}</h2>
        <div class="srcline">${p.src}</div>
      </div>
      <div class="pheadbtns">
        <button class="copy" id="notesBtn">📝 show notes</button>
        <button class="copy" id="varBtn">🔀 variations</button>
        <button class="copy" id="codeBtn">⌨ hide code</button>
        <button class="copy" id="copyBtn">copy code</button>
      </div>
    </div>
    <div class="notesWrap" id="notesWrap" style="display:none">${notes}</div>
    <div class="varWrap" id="varWrap" style="display:none">${varPanel(p)}</div>
    <div class="split" id="split">
      <div class="demo">
        <div class="h">◈ STEP-BY-STEP — ${p.label.toUpperCase()}</div>
        <div class="stage" id="stage"></div>
        <div class="vmsg" id="vmsg"></div>
        <div class="vtables" id="vtables"></div>
        <div class="vctrl">
          <button class="play" id="play">▶ play</button>
          <button id="stepBtn">step ›</button>
          <button id="resetBtn">⟲ reset</button>
          <span class="vpos" id="vpos"></span>
          <span class="spd">speed <input type="range" id="spd" min="280" max="1700" value="950"><b id="spdlbl"></b></span>
        </div>
        <div class="trace"><div class="th">CODE BEING TRACED — <b>active line highlights live</b></div><pre id="trace"></pre></div>
      </div>
      <div class="codeCol">${codeHtml}</div>
    </div>
    <div class="pnav">
      <button id="prevBtn" ${active===0?'disabled':''}>← prev</button>
      <span class="pos">${active+1} of ${P.length}</span>
      <button id="nextBtn" ${active===P.length-1?'disabled':''}>next →</button>
    </div></div>`;
  main.scrollTop=0;
  const nb=main.querySelector('#notesBtn'), nw=main.querySelector('#notesWrap');
  nb.onclick=()=>{const show=nw.style.display==='none';nw.style.display=show?'':'none';nb.textContent=show?'📝 hide notes':'📝 show notes';nb.classList.toggle('done',show);};
  const vb=main.querySelector('#varBtn'), vw=main.querySelector('#varWrap');
  vb.onclick=()=>{const show=vw.style.display==='none';vw.style.display=show?'':'none';vb.textContent=show?'🔀 hide variations':'🔀 variations';vb.classList.toggle('done',show);};
  main.querySelectorAll('.varcopy').forEach(b=>b.onclick=()=>{const v=(VARS[p.label]||[])[+b.dataset.vi];navigator.clipboard.writeText(v.code);b.textContent='✓';setTimeout(()=>b.textContent='copy',1200);});
  const cbtn=main.querySelector('#codeBtn'), split=main.querySelector('#split');
  cbtn.onclick=()=>{const hid=!split.classList.contains('nocode');split.classList.toggle('nocode',hid);cbtn.textContent=hid?'⌨ show code':'⌨ hide code';cbtn.classList.toggle('done',hid);};
  main.querySelector('#copyBtn').onclick=e=>{navigator.clipboard.writeText(p.code);e.target.textContent='✓ copied';e.target.classList.add('done');setTimeout(()=>{e.target.textContent='copy code';e.target.classList.remove('done');},1500);};
  main.querySelector('#prevBtn').onclick=()=>{if(active>0){active--;render();}};
  main.querySelector('#nextBtn').onclick=()=>{if(active<P.length-1){active++;render();}};
  main.querySelectorAll('.cl.has-cm').forEach(el=>el.onclick=()=>el.classList.toggle('reveal'));
  const ra=main.querySelector('#revealAll');
  ra.onclick=()=>{const ls=[...main.querySelector('.cb').querySelectorAll('.cl.has-cm')];const on=ls.some(l=>l.classList.contains('reveal'));ls.forEach(l=>l.classList.toggle('reveal',!on));ra.classList.toggle('on',!on);ra.textContent=on?'💬 reveal all':'🙈 hide all';};
  mountStepper(p);
  buildSidebar();
}

function mountStepper(p){
  const frames=p.gen();
  const stage=main.querySelector('#stage'), vmsg=main.querySelector('#vmsg'),
        vtables=main.querySelector('#vtables'), vpos=main.querySelector('#vpos'),
        traceEl=main.querySelector('#trace'), playBtn=main.querySelector('#play'),
        spd=main.querySelector('#spd'), spdlbl=main.querySelector('#spdlbl');
  const tEls=[]; p.trace.forEach(ln=>{const x=document.createElement('span');x.className='tln';x.innerHTML=hl(ln)||'&nbsp;';traceEl.appendChild(x);tEls.push(x);});
  let idx=0;
  function draw(){
    const f=frames[idx];
    stage.innerHTML=svgFrame(f);
    vmsg.classList.remove('flash');void vmsg.offsetWidth;vmsg.classList.add('flash');
    vmsg.innerHTML=`<span class="stepchip">STEP ${idx+1}</span>${f.msg}`;
    const sp=frameSide(f);
    vtables.innerHTML=(sp.heap?`<div style="flex:1;min-width:100%">${sp.heap}</div>`:'')+sp.tables;
    tEls.forEach((e,i)=>e.classList.toggle('hot',i===f.line));
    vpos.textContent=`${idx+1} / ${frames.length}`;
  }
  function stop(){if(stepTimer){clearInterval(stepTimer);stepTimer=null;}playBtn.textContent='▶ play';}
  function play(){ if(stepTimer){stop();return;} if(idx>=frames.length-1)idx=0; playBtn.textContent='❚❚ pause';
    stepTimer=setInterval(()=>{ if(idx>=frames.length-1){stop();return;} idx++;draw(); }, +spd.value); }
  const setspd=()=>{spdlbl.textContent=(spd.value/1000).toFixed(2)+'s'; if(stepTimer){clearInterval(stepTimer);stepTimer=setInterval(()=>{if(idx>=frames.length-1){stop();return;}idx++;draw();},+spd.value);}};
  spd.oninput=setspd; setspd();
  playBtn.onclick=play;
  main.querySelector('#stepBtn').onclick=()=>{stop();if(idx<frames.length-1){idx++;draw();}};
  main.querySelector('#resetBtn').onclick=()=>{stop();idx=0;draw();};
  draw();
}

render();

</script>
